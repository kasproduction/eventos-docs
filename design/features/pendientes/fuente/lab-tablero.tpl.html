<!doctype html>
<html lang="es" data-theme="noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab tablero de pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Urbanist:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
/* Lab: 3 direcciones del tablero de pendientes. Noir/Lux White Chrome de EventOS (como Data Center):
   chrome blanco/tinta, color solo para datos (prioridades). Noir con bordes luminosos sin sombra;
   Lux con sombras suaves sin bordes. Plus Jakarta para titulos y numeros, Urbanist para todo lo demas. */
:root{
  --bg:#0a0a0b; --col:#111113; --card:#17171a; --card-h:#1d1d21; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --t1:#f2f1ee; --t2:#a09fa6; --t3:#6b6a71; --ink:#f2f1ee; --onink:#0a0a0b; --shadow:none;
  --ya:#ff8a4c; --ya-s:rgba(255,138,76,.13); --antes:#7ea6ff; --antes-s:rgba(126,166,255,.13);
  --desp:#9a9ca6; --desp-s:rgba(154,156,166,.13); --no:#f26d78; --no-s:rgba(242,109,120,.12); --sin:#6b6a71; --sin-s:rgba(255,255,255,.05);
  --plat:#b5a68b;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-s:10px;
  color-scheme:dark;
}
:root[data-theme="lux"]{
  --bg:#f3f3f1; --col:#e9e9e6; --card:#ffffff; --card-h:#fbfbfa; --line:transparent; --line2:rgba(16,16,20,.12);
  --t1:#141418; --t2:#5c5c66; --t3:#94949c; --ink:#141418; --onink:#ffffff; --shadow:0 1px 2px rgba(16,16,20,.06),0 4px 14px rgba(16,16,20,.05);
  --ya:#d2541b; --ya-s:rgba(210,84,27,.10); --antes:#2f5fd0; --antes-s:rgba(47,95,208,.09);
  --desp:#62646e; --desp-s:rgba(98,100,110,.10); --no:#c2293a; --no-s:rgba(194,41,58,.08); --sin:#94949c; --sin-s:rgba(16,16,20,.04);
  --plat:#8b7e5f;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t1);font:15px/1.5 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}

.app{height:100%;display:flex;flex-direction:column}
/* barra del lab: no es parte del diseño */
.labbar{flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:#000;color:#fff;font-size:13px}
.labbar b{font-family:var(--display);font-weight:700;margin-right:4px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;color:rgba(255,255,255,.65);font-weight:600}
.seg button.on{background:#fff;color:#000}
.labbar .hint{color:rgba(255,255,255,.5);margin-left:auto}

/* cabecera del producto */
.head{flex:0 0 auto;padding:16px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line2)}
.head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.head p{margin:2px 0 0;color:var(--t2);font-size:14px}
.kpis{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.kpi{display:flex;flex-direction:column;align-items:flex-end}
.kpi b{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.kpi span{color:var(--t3);font-size:12.5px}
.mods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.mods::-webkit-scrollbar{display:none}
.mod-chip{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--t2);font-weight:600;font-size:13.5px;white-space:nowrap;min-height:34px}
.mod-chip.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.mod-chip span{font-variant-numeric:tabular-nums;opacity:.6;margin-left:5px}

.stage{flex:1 1 auto;min-height:0;position:relative;display:flex}
.view{flex:1 1 auto;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* tarjeta comun */
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r-s);padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.card:hover{background:var(--card-h)}
.card.sel{border-color:var(--ink)}
.card .ct{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.35;color:var(--t1);overflow-wrap:anywhere}
.card .cd{color:var(--t2);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .cm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;font-weight:600;color:var(--t3)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.srv{background:var(--no-s);color:var(--no)} .pill.loc{background:var(--sin-s);color:var(--t2)} .pill.mix{background:var(--antes-s);color:var(--antes)} .pill.par{background:var(--ya-s);color:var(--ya)}
.pill.nota{background:var(--sin-s);color:var(--plat)}
.sortable-ghost{opacity:.35}
.sortable-chosen{transform:scale(1.02)}
.sortable-drag{box-shadow:0 12px 30px rgba(0,0,0,.35)!important}

/* ---------- A: tablero por prioridad ---------- */
.A{display:flex;gap:12px;padding:14px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));min-height:100%;align-items:flex-start;scroll-snap-type:x proximity}
.A .colm{flex:1 1 200px;min-width:200px;max-width:340px;background:var(--col);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100% - 4px);scroll-snap-align:start}
.colh{padding:12px 14px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0}
.colh-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.colh h2{font-size:15px;font-weight:700}
.colh .n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding:1px 9px;border-radius:99px}
.colh p{margin:0;color:var(--t3);font-size:12.5px;line-height:1.35}
.colb{flex:1 1 auto;overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.grp{font-size:12.5px;font-weight:700;color:var(--t2);padding:10px 2px 0}
.n.ya{background:var(--ya-s);color:var(--ya)} .n.antes{background:var(--antes-s);color:var(--antes)} .n.despues{background:var(--desp-s);color:var(--desp)} .n.descartar{background:var(--no-s);color:var(--no)} .n.sin{background:var(--sin-s);color:var(--t2)}
.empty-drop{border:1.5px dashed var(--line2);border-radius:var(--r-s);padding:18px 10px;text-align:center;color:var(--t3);font-size:13px}

/* ---------- B: tabla por modulo ---------- */
.B{padding:8px max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left));max-width:1100px}
.bgroup{margin-top:18px}
.bgh{display:flex;align-items:center;gap:12px;padding:8px 4px;width:100%;text-align:left;min-height:44px}
.bgh h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.bgh .cnt{color:var(--t3);font-size:13px;font-variant-numeric:tabular-nums}
.bgh .chev{margin-left:auto;color:var(--t3);font-size:16px;transition:transform .2s ease}
.bgroup.closed .chev{transform:rotate(-90deg)}
.bgroup.closed .brows{display:none}
.dist{display:flex;height:6px;border-radius:99px;overflow:hidden;width:120px;background:var(--sin-s)}
.dist i{display:block}
.brows{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.brow{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 130px;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2);min-height:52px;background:var(--card)}
.brow:first-child{border-top:0}
.brow .hd{color:var(--t3);cursor:grab;font-size:16px;text-align:center;touch-action:none;padding:6px 0}
.brow .bt{min-width:0;cursor:pointer}
.brow .bt b{display:block;font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.brow .bt span{display:block;color:var(--t3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppick{justify-self:start;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;min-height:34px;white-space:nowrap}
.ppick.ya{background:var(--ya-s);color:var(--ya)} .ppick.antes{background:var(--antes-s);color:var(--antes)} .ppick.despues{background:var(--desp-s);color:var(--desp)} .ppick.descartar{background:var(--no-s);color:var(--no)} .ppick.sin{background:var(--sin-s);color:var(--t2);border:1px dashed var(--line2)}
.brow .tg{justify-self:end}
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.3);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:190px}
.menu button{text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;min-height:42px}
.menu button:hover{background:var(--sin-s)}

/* ---------- C: filas por modulo x columnas por prioridad ---------- */
.C{padding:0 max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left));min-width:1100px}
.C .chead{position:sticky;top:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 0 8px}
.C .chead div{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.C .chead h2{font-size:14px;font-weight:700}
.lane{margin-top:10px}
.laneh{display:flex;align-items:center;gap:10px;padding:8px 2px;position:sticky;left:0;min-height:44px}
.laneh h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.laneh .cnt{color:var(--t3);font-size:13px}
.laneh .chev{color:var(--t3);transition:transform .2s ease}
.lane.closed .chev{transform:rotate(-90deg)}
.lane.closed .cells{display:none}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.chead .n{font-family:var(--display);font-weight:700;font-size:13px;padding:1px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.cell{background:var(--col);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:64px}

/* panel de detalle: lateral en pantallas anchas, hoja inferior en celular */
.detail{flex:0 0 400px;border-left:1px solid var(--line2);background:var(--bg);overflow-y:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:16px}
.detail[hidden]{display:none}
.dx{align-self:flex-end;font-size:14px;font-weight:600;color:var(--t2);padding:8px 12px;border-radius:99px;border:1px solid var(--line2);min-height:38px}
.dmod{font-size:13px;font-weight:700;color:var(--plat)}
.detail h2{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.ddesc{color:var(--t2);font-size:15px;line-height:1.6}
.dk{display:flex;flex-direction:column;gap:6px}
.dk small{color:var(--t3);font-size:12.5px;font-weight:600}
.dk div{font-size:14px;overflow-wrap:anywhere}
.dprio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dprio button{padding:11px 10px;border-radius:12px;border:1px solid var(--line2);font-weight:700;font-family:var(--display);font-size:14px;min-height:46px;color:var(--t2)}
.dprio button.on.ya{background:var(--ya-s);border-color:var(--ya);color:var(--ya)}
.dprio button.on.antes{background:var(--antes-s);border-color:var(--antes);color:var(--antes)}
.dprio button.on.despues{background:var(--desp-s);border-color:var(--desp);color:var(--t1)}
.dprio button.on.descartar{background:var(--no-s);border-color:var(--no);color:var(--no)}
.dnote{width:100%;min-height:110px;font:inherit;font-size:16px;color:var(--t1);background:var(--col);border:1px solid var(--line2);border-radius:12px;padding:12px;resize:vertical}

@media (max-width:899px){
  .detail{position:fixed;inset:auto 0 0 0;max-height:82%;border-left:0;border-top:1px solid var(--line2);border-radius:20px 20px 0 0;z-index:40;box-shadow:0 -20px 50px rgba(0,0,0,.35);padding-bottom:max(28px,env(safe-area-inset-bottom))}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .brow{grid-template-columns:24px minmax(0,1fr) auto}
  .brow .tg{display:none}
  .kpis{display:none}
}
@media (max-width:600px){
  .A{flex-direction:column;scroll-snap-type:none}
  .A .colm{flex:none;max-width:none;width:100%;max-height:none}
  .A .colb{overflow:visible}
  .A.tabsmode .colm{display:none} .A.tabsmode .colm.cur{display:flex}
  .atabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
  .brow .bt span{display:none}
  .head h1{font-size:21px}
}
@media (min-width:601px){ .atabs{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} .sortable-chosen{transform:none} }
.scrim[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="labbar">
    <b>Lab tablero</b>
    <div class="seg" id="segDir"><button data-d="A" class="on">A Por prioridad</button><button data-d="B">B Por módulo</button><button data-d="C">C Módulo y prioridad</button></div>
    <div class="seg" id="segTheme"><button data-t="noir" class="on">Noir</button><button data-t="lux">Lux</button></div>
    <span class="hint">Datos reales de PENDIENTES.md. En el lab las prioridades se guardan solo en este navegador.</span>
  </div>
  <header class="head">
    <div class="head-top">
      <div><h1>Pendientes EventOS</h1><p id="sub"></p></div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="mods" id="mods"></div>
  </header>
  <div class="atabs" id="atabs"></div>
  <div class="stage">
    <div class="view" id="view"></div>
    <div class="scrim" id="scrim" hidden></div>
    <aside class="detail" id="detail" hidden></aside>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D = JSON.parse(document.getElementById("data").textContent);
const T = D.tareas, MODS = D.modulos.filter(m => m.n > 0);
const MODN = Object.fromEntries(MODS.map(m => [m.k, m.t]));
const COLS = [
  {v:"sin", l:"Sin decidir", h:"Lo que todavía no revisas."},
  {v:"ya", l:"Ya", h:"Esta semana o la que sigue."},
  {v:"antes", l:"Antes del evento", h:"Tiene que estar antes del 6 de diciembre."},
  {v:"despues", l:"Después", h:"Después del evento o si un cliente lo pide."},
  {v:"descartar", l:"Descartar", h:"No se hace. Sale en la próxima limpieza."}
];
const COLN = Object.fromEntries(COLS.map(c => [c.v, c.l]));
const TAG = {"servidor":["srv","Necesita servidor"],"local":["loc","En local"],"local+medir":["mix","Local, se mide en servidor"]};
let S = {dir:"A", theme:"noir", mod:"todos", sel:null, acol:"sin", closed:{}};
let P = {};
try { P = JSON.parse(localStorage.getItem("lab-prios")||"{}"); } catch(e) {}
try { Object.assign(S, JSON.parse(localStorage.getItem("lab-state")||"{}")); S.sel = null; } catch(e) {}
const save = () => { try { localStorage.setItem("lab-prios", JSON.stringify(P)); localStorage.setItem("lab-state", JSON.stringify({dir:S.dir,theme:S.theme,mod:S.mod,acol:S.acol,closed:S.closed})); } catch(e) {} };
const pr = id => (P[id] && P[id].p) || "sin";
const ord = id => (P[id] && P[id].o != null) ? P[id].o : 1e6;
const el = (tag, a, ...k) => { const n = document.createElement(tag); for (const x in (a||{})) { const v = a[x]; if (v == null || v === false) continue; if (x === "text") n.textContent = v; else if (x === "cls") n.className = v; else if (x.startsWith("on")) n.addEventListener(x.slice(2), v); else n.setAttribute(x, v); } k.forEach(c => c != null && n.append(c)); return n; };
const visible = () => T.filter(t => S.mod === "todos" || t.mod === S.mod);
const byOrd = (a, b) => ord(a.id) - ord(b.id);
let sortables = [];
const killSortables = () => { sortables.forEach(s => s.destroy()); sortables = []; };
const SORT_OPTS = {animation:180, delay:160, delayOnTouchOnly:true, touchStartThreshold:4, ghostClass:"sortable-ghost", chosenClass:"sortable-chosen", dragClass:"sortable-drag", forceFallback:false};

function setPrio(id, p){ P[id] = Object.assign({}, P[id]||{}, {p}); if (p === "sin") delete P[id].p; save(); }
function reorder(listEl, p){ [...listEl.querySelectorAll("[data-id]")].forEach((n,i) => { const id = n.dataset.id; P[id] = Object.assign({}, P[id]||{}, {o:i}); if (p) { if (p === "sin") delete P[id].p; else P[id].p = p; } }); save(); }

function card(t){
  const c = el("div",{cls:"card"+(S.sel===t.id?" sel":""),"data-id":t.id,role:"button",tabindex:"0"});
  c.append(el("div",{cls:"ct",text:t.titulo}));
  if (t.desc) c.append(el("div",{cls:"cd",text:t.desc}));
  const m = el("div",{cls:"cm"});
  if (S.dir !== "C" && S.mod === "todos") m.append(el("span",{cls:"lbl",text:MODN[t.mod]}));
  if (t.parcial) m.append(el("span",{cls:"pill par",text:"Falta medir"}));
  if (t.etiqueta) m.append(el("span",{cls:"pill "+TAG[t.etiqueta][0],text:TAG[t.etiqueta][1]}));
  if (P[t.id] && P[t.id].nota) m.append(el("span",{cls:"pill nota",text:"Con nota"}));
  c.append(m);
  c.addEventListener("click", () => openDetail(t.id));
  c.addEventListener("keydown", e => { if (e.key === "Enter") openDetail(t.id); });
  return c;
}

function renderHead(){
  const v = visible(), dec = v.filter(t => pr(t.id) !== "sin").length;
  document.getElementById("sub").textContent = v.length + " tareas abiertas" + (S.mod === "todos" ? " en " + MODS.length + " módulos" : " en " + MODN[S.mod]) + ". Arrastra para priorizar o toca una tarea para ver el detalle.";
  const k = document.getElementById("kpis"); k.replaceChildren(
    ...[["ya","Ya"],["antes","Antes del evento"]].map(([p,l]) => el("div",{cls:"kpi"}, el("b",{text:String(v.filter(t=>pr(t.id)===p).length)}), el("span",{text:l}))),
    el("div",{cls:"kpi"}, el("b",{text:dec+"/"+v.length}), el("span",{text:"priorizadas"})));
  const m = document.getElementById("mods");
  m.replaceChildren(el("button",{cls:"mod-chip"+(S.mod==="todos"?" on":""),onclick:()=>{S.mod="todos";render();}},"Todos",el("span",{text:String(T.length)})),
    ...MODS.map(x => el("button",{cls:"mod-chip"+(S.mod===x.k?" on":""),onclick:()=>{S.mod=x.k;render();}}, x.t, el("span",{text:String(x.n)}))));
}

function renderA(view){
  const wrap = el("div",{cls:"A tabsmode"});
  const tabs = document.getElementById("atabs"); tabs.replaceChildren();
  for (const c of COLS) {
    const items = visible().filter(t => pr(t.id) === c.v).sort(byOrd);
    tabs.append(el("button",{cls:"mod-chip"+(S.acol===c.v?" on":""),onclick:()=>{S.acol=c.v;render();}}, c.l, el("span",{text:String(items.length)})));
    const col = el("section",{cls:"colm"+(S.acol===c.v?" cur":"")});
    col.append(el("div",{cls:"colh"}, el("div",{cls:"colh-row"}, el("h2",{text:c.l}), el("span",{cls:"n "+c.v,text:String(items.length)})), el("p",{text:c.h})));
    const body = el("div",{cls:"colb","data-p":c.v});
    if (c.v === "sin" && S.mod === "todos") {
      // agrupado por modulo para que la columna larga se pueda leer
      let last = null;
      for (const t of items.sort((a,b) => MODS.findIndex(m=>m.k===a.mod) - MODS.findIndex(m=>m.k===b.mod) || byOrd(a,b))) {
        if (t.mod !== last) { last = t.mod; body.append(el("div",{cls:"grp",text:MODN[t.mod]})); }
        body.append(card(t));
      }
    } else items.forEach(t => body.append(card(t)));
    if (!items.length) body.append(el("div",{cls:"empty-drop",text:"Arrastra tareas aquí"}));
    col.append(body); wrap.append(col);
  }
  view.append(wrap);
  wrap.querySelectorAll(".colb").forEach(b => sortables.push(Sortable.create(b, Object.assign({}, SORT_OPTS, {group:"A", draggable:".card", filter:".grp,.empty-drop",
    onEnd: e => { reorder(e.to, e.to.dataset.p); if (e.from !== e.to) reorder(e.from, null); render(); }}))));
}

function renderB(view){
  const wrap = el("div",{cls:"B"});
  for (const m of MODS) {
    if (S.mod !== "todos" && S.mod !== m.k) continue;
    const items = T.filter(t => t.mod === m.k).sort(byOrd);
    const g = el("section",{cls:"bgroup"+(S.closed[m.k]?" closed":"")});
    const dist = el("div",{cls:"dist"});
    for (const c of COLS.slice(1)) { const n = items.filter(t=>pr(t.id)===c.v).length; if (n) { const i = el("i"); i.style.width = (100*n/items.length)+"%"; i.style.background = "var(--"+(c.v==="despues"?"desp":c.v==="descartar"?"no":c.v)+")"; dist.append(i); } }
    g.append(el("button",{cls:"bgh",onclick:()=>{S.closed[m.k]=!S.closed[m.k]; save(); render();}}, el("h2",{text:m.t}), el("span",{cls:"cnt",text:items.filter(t=>pr(t.id)!=="sin").length+" de "+items.length+" priorizadas"}), dist, el("span",{cls:"chev",text:"⌄"})));
    const rows = el("div",{cls:"brows","data-m":m.k});
    for (const t of items) {
      const r = el("div",{cls:"brow","data-id":t.id});
      r.append(el("span",{cls:"hd",text:"⠿","aria-label":"Arrastrar para ordenar"}));
      r.append(el("div",{cls:"bt",onclick:()=>openDetail(t.id)}, el("b",{text:t.titulo}), el("span",{text:t.desc||" "})));
      const p = pr(t.id);
      r.append(el("button",{cls:"ppick "+p,onclick:e=>openMenu(e.currentTarget,t.id)}, p==="sin" ? "Sin decidir" : COLN[p]));
      r.append(el("span",{cls:"tg"}, t.etiqueta ? el("span",{cls:"pill "+TAG[t.etiqueta][0],text:TAG[t.etiqueta][1]}) : null));
      rows.append(r);
    }
    g.append(rows); wrap.append(g);
    sortables.push(Sortable.create(rows, Object.assign({}, SORT_OPTS, {handle:".hd", delay:0, onEnd: e => { reorder(e.to, null); }})));
  }
  view.append(wrap);
}

function renderC(view){
  const wrap = el("div",{cls:"C"});
  const head = el("div",{cls:"chead"});
  COLS.forEach(c => head.append(el("div",{}, el("h2",{text:c.l}), el("span",{cls:"n "+c.v,text:String(visible().filter(t=>pr(t.id)===c.v).length)}))));
  wrap.append(head);
  for (const m of MODS) {
    if (S.mod !== "todos" && S.mod !== m.k) continue;
    const items = T.filter(t => t.mod === m.k);
    const lane = el("section",{cls:"lane"+(S.closed["c"+m.k]?" closed":"")});
    lane.append(el("button",{cls:"laneh",onclick:()=>{S.closed["c"+m.k]=!S.closed["c"+m.k]; save(); render();}}, el("span",{cls:"chev",text:"⌄"}), el("h3",{text:m.t}), el("span",{cls:"cnt",text:items.length+" tareas"})));
    const cells = el("div",{cls:"cells"});
    for (const c of COLS) {
      const cell = el("div",{cls:"cell","data-p":c.v,"data-m":m.k});
      items.filter(t => pr(t.id) === c.v).sort(byOrd).forEach(t => cell.append(card(t)));
      cells.append(cell);
    }
    lane.append(cells); wrap.append(lane);
    cells.querySelectorAll(".cell").forEach(cell => sortables.push(Sortable.create(cell, Object.assign({}, SORT_OPTS, {group:"lane-"+m.k, draggable:".card",
      onEnd: e => { reorder(e.to, e.to.dataset.p); if (e.from !== e.to) reorder(e.from, null); render(); }}))));
  }
  view.append(wrap);
}

function openMenu(btn, id){
  closeMenu();
  const r = btn.getBoundingClientRect();
  const m = el("div",{cls:"menu",id:"menu",role:"menu"});
  COLS.forEach(c => m.append(el("button",{role:"menuitem",onclick:()=>{ setPrio(id, c.v); closeMenu(); render(); }}, c.l)));
  document.body.append(m);
  const top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 12), left = Math.min(r.left, innerWidth - m.offsetWidth - 12);
  m.style.top = top + "px"; m.style.left = Math.max(12,left) + "px";
  setTimeout(() => document.addEventListener("pointerdown", outside, {once:true}), 0);
  function outside(e){ if (!m.contains(e.target)) closeMenu(); else document.addEventListener("pointerdown", outside, {once:true}); }
}
function closeMenu(){ const m = document.getElementById("menu"); if (m) m.remove(); }

function openDetail(id){ S.sel = id; render(); }
function closeDetail(){ S.sel = null; render(); }
function renderDetail(){
  const d = document.getElementById("detail"), sc = document.getElementById("scrim");
  const t = T.find(x => x.id === S.sel);
  if (!t) { d.hidden = true; sc.hidden = true; return; }
  d.hidden = false; sc.hidden = innerWidth >= 900;
  const p = pr(t.id);
  d.replaceChildren(...[
    el("button",{cls:"dx",onclick:closeDetail},"Cerrar"),
    el("div",{cls:"dmod",text:MODN[t.mod]}),
    el("h2",{text:t.titulo}),
    t.desc ? el("div",{cls:"ddesc",text:t.desc}) : null,
    el("div",{cls:"dk"}, el("small",{text:"Prioridad"}), (() => { const g = el("div",{cls:"dprio"}); COLS.slice(1).forEach(c => g.append(el("button",{cls:c.v+(p===c.v?" on":""),onclick:()=>{ setPrio(t.id, p===c.v?"sin":c.v); render(); }}, c.l))); return g; })()),
    t.etiqueta ? el("div",{cls:"dk"}, el("small",{text:"Dónde se hace"}), el("div",{text:TAG[t.etiqueta][1]})) : null,
    el("div",{cls:"dk"}, el("small",{text:"Origen"}), el("div",{text: t.secT + (t.sub ? ", " + t.sub : "")})),
    t.fuentes.length ? el("div",{cls:"dk"}, el("small",{text:"Fuente"}), el("div",{text:t.fuentes.join(", ")})) : null,
    el("div",{cls:"dk"}, el("small",{text:"Nota"}), (() => { const n = el("textarea",{cls:"dnote",placeholder:"Por qué, de qué depende, qué cambia"}); n.value = (P[t.id]&&P[t.id].nota)||""; n.addEventListener("input",()=>{ P[t.id]=Object.assign({},P[t.id]||{},{nota:n.value}); save(); }); return n; })())
  ].filter(Boolean));
}
document.getElementById("scrim").addEventListener("click", closeDetail);

function render(){
  document.documentElement.dataset.theme = S.theme;
  document.querySelectorAll("#segDir button").forEach(b => b.classList.toggle("on", b.dataset.d === S.dir));
  document.querySelectorAll("#segTheme button").forEach(b => b.classList.toggle("on", b.dataset.t === S.theme));
  document.getElementById("atabs").style.display = S.dir === "A" ? "" : "none";
  killSortables(); closeMenu();
  const view = document.getElementById("view"); const sx = view.scrollLeft, sy = view.scrollTop;
  view.replaceChildren();
  renderHead();
  ({A:renderA,B:renderB,C:renderC})[S.dir](view);
  view.scrollLeft = sx; view.scrollTop = sy;
  renderDetail();
}
document.getElementById("segDir").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.dir = b.dataset.d; save(); render(); } });
document.getElementById("segTheme").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.theme = b.dataset.t; save(); render(); } });
addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); closeDetail(); } });
render();
})();
</script>
</body>
</html>
