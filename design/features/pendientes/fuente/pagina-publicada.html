quién se le cuenta."}, "2929117b9fad": {"titulo": "Entrar con la cuenta de Google", "que": "Un botón de \"Entrar con Google\" para que la persona no tenga que escribir su correo ni esperar el enlace.", "porque": "Hace más rápido entrar, pero no es necesario para el evento. Queda para después.", "lista": "Cuando alguien entra con Google y queda dentro del evento correcto."}, "d33158cabf91": {"titulo": "Que el organizador diseñe sus correos arrastrando bloques", "que": "Un editor visual en el admin para armar los correos del evento sin saber de diseño: arrastrar un título, una imagen, un botón.", "porque": "Le da independencia al organizador. Es de una fase futura, no para diciembre.", "lista": "Cuando un organizador arma un correo con el editor y llega bien a una bandeja de prueba."}, "e7494f18a38e": {"titulo": "Resumen después del evento: \"conectaste con X personas\"", "que": "Al terminar el evento, mandarle a cada persona un resumen con cuánta gente conoció, para que retome el contacto.", "porque": "Hace que el valor del evento dure después de que termina. Es para después.", "lista": "Cuando, al cerrar un evento de prueba, cada asistente recibe su resumen con sus conexiones."}, "2aef5fb49fad": {"titulo": "Un collage automático con las fotos del evento", "que": "Armar solo, al final del evento, un collage con las fotos que subió la gente.", "porque": "Es un recuerdo fácil de compartir que hace ver bien al evento. Es para después.", "lista": "Cuando al cerrar un evento de prueba se genera el collage con sus fotos."}, "8d9faddd5e91": {"titulo": "Ver las grabaciones de las charlas después del evento", "que": "Que las transmisiones queden guardadas y los asistentes puedan verlas cuando el evento ya pasó.", "porque": "Alarga la vida del evento y es algo que muchos clientes piden. Es para después del 6 de diciembre.", "lista": "Cuando, terminado un evento de prueba, un asistente puede ver la grabación de una charla."}, "31ccd1791b4f": {"titulo": "Guardar una copia completa de un evento y poder recuperarla", "que": "Un botón que guarde todo un evento (sesiones, speakers, configuración) en un archivo, para recuperarlo si algo se borra o para usarlo de base en otro evento.", "porque": "Protege contra un error humano en el admin. Es para después.", "lista": "Cuando guardas un evento, lo borras en una prueba y lo recuperas igual desde el archivo."}, "2138a1b608a1": {"titulo": "La entrada del evento en la billetera del celular", "que": "Que la persona pueda guardar su entrada en la billetera del iPhone o en Google Wallet, como un pasabordo.", "porque": "Es cómodo y se ve muy profesional, pero no es necesario para diciembre.", "lista": "Cuando la entrada se agrega a la billetera en un iPhone y en un Android."}, "9489ab6ec577": {"titulo": "Que el organizador arme su landing desde el admin", "que": "Un editor en el admin para que el organizador arme la página de su evento con bloques, sin que tengamos que hacerla nosotros.", "porque": "Permite atender a más clientes sin trabajo a la medida. Es de una fase futura.", "lista": "Cuando un organizador arma una landing desde el admin y se ve publicada."}, "ae8cdad56672": {"titulo": "Probar dos versiones de un correo para ver cuál funciona mejor", "que": "Mandar dos versiones de un mismo correo a grupos distintos y medir cuál abren o cliquean más.", "porque": "Ayuda al organizador a que más gente se inscriba. Es de una fase futura.", "lista": "Cuando se envían dos versiones y el admin muestra cuál funcionó mejor."}, "f85747961ec8": {"titulo": "Juegos hechos en Unity para los stands", "que": "Juegos más elaborados, hechos con Unity (una herramienta para crear videojuegos), para pantallas en los stands. Necesita un desarrollador de Unity aparte.", "porque": "Da un efecto muy vistoso en los stands, pero depende de otra persona. No es para diciembre.", "lista": "Cuando hay un juego de Unity funcionando en un stand y conectado a la plataforma."}, "43b4d11956e6": {"titulo": "Pulir el demo para mostrárselo a inversionistas", "que": "Mejorar la presentación del producto para inversionistas: que los paneles se puedan tocar, que se vea bien en pantalla grande (1920x1080), con sonido, pistas que guíen a quien lo mira y el muro social.", "porque": "Sirve para vender el producto o buscar inversión, no para el evento.", "lista": "Cuando el demo se recorre completo en pantalla grande, con sonido y pistas, sin tener que explicarlo en voz alta."}, "c1c7fc8e28cb": {"titulo": "Probar la webapp en un portátil, un iPad y un iPhone de verdad", "que": "Hasta ahora la webapp se ha revisado en el simulador de Chrome, que imita otros tamaños de pantalla pero no es igual a un aparato real. Falta recorrerla en un portátil, un iPad y un iPhone de verdad. Esta parte solo se puede hacer contigo, con los aparatos en la mano.", "porque": "El 6 de diciembre la gente va a entrar desde sus propios aparatos, no desde un simulador. Lo que se vea raro en un iPhone real lo van a ver miles.", "lista": "Cuando recorrimos todos los módulos en los tres aparatos y anotamos y corregimos lo que se veía mal."}, "36840671f3f5": {"titulo": "Revisar el aviso que sale en el iPad vertical", "que": "Cuando alguien abre la webapp en un iPad puesto de pie, aparece un aviso. Hay que confirmar que ese aviso se ve bien y que no tapa nada importante de la pantalla.", "porque": "Muchos ejecutivos revisan en iPad. Un aviso mal puesto da la impresión de producto sin terminar.", "lista": "Cuando en un iPad vertical real el aviso se ve completo y no tapa ningún botón ni contenido."}, "c6ddc300fb49": {"titulo": "Probar la webapp en el Edge de las empresas", "que": "Las empresas grandes suelen usar el navegador Edge de Microsoft con reglas puestas por su área de sistemas, que a veces bloquean cosas. Hay que abrir la webapp ahí y revisar que entrar, ver el streaming y recibir lo que pasa en vivo funcionen.", "porque": "Los clientes corporativos van a abrir la plataforma desde el computador de la oficina. Si falla ahí, se pierde la venta.", "lista": "Cuando en un Edge con reglas de empresa se puede entrar, ver el streaming y lo en vivo llega sin errores."}, "aeedbe3e1047": {"titulo": "Probar la webapp completa en Firefox", "que": "Recorrer toda la webapp en el navegador Firefox, versión 115 o más nueva: entrar, ver la agenda, ver el streaming y usar la parte social.", "porque": "Una parte de los asistentes usa Firefox. Si algo no carga ahí, esas personas se quedan por fuera.", "lista": "Cuando el recorrido completo en Firefox 115 o superior pasa sin errores."}, "3915a38885ec": {"titulo": "Que las pantallas vacías se vean igual en todos los módulos", "que": "Cuando un módulo no tiene nada que mostrar (no hay sesiones, no hay fotos, no hay patrocinadores), sale un mensaje de \"aquí todavía no hay nada\". Hoy cada pantalla lo muestra a su manera. La idea es que todas usen el mismo estilo.", "porque": "Al comienzo de un evento muchas pantallas están vacías. Si cada una se ve distinta, el producto se siente armado por partes.", "lista": "Cuando todos los módulos muestran su pantalla vacía con el mismo diseño."}, "d07a949b2541": {"titulo": "Que el paso de \"cargando\" al contenido no dé saltos", "que": "Mientras una pantalla carga, se muestra una silueta gris del contenido. Cuando llega lo real, a veces todo brinca de golpe. La idea es que ese cambio sea suave en todos los módulos.", "porque": "Ese salto se nota en cada pantalla que se abre y hace que la plataforma se sienta menos pulida frente a un cliente.", "lista": "Cuando en todos los módulos el contenido aparece en el mismo lugar de la silueta, sin brincos."}, "f0f32ee898e3": {"titulo": "Poder usar toda la webapp solo con el teclado", "que": "Algunas personas no usan mouse, por ejemplo por una discapacidad. Deben poder llegar a cada botón y enlace con la tecla Tab y activarlo con Enter.", "porque": "Las empresas grandes exigen accesibilidad a sus proveedores, y esto es parte de lo que revisan.", "lista": "Cuando se puede recorrer y usar cada módulo de principio a fin sin tocar el mouse."}, "48c15ce24a93": {"titulo": "Que el teclado recorra la pantalla en el orden en que se ve", "que": "Al presionar Tab, la webapp va pasando de un botón al siguiente. Ese orden debe seguir lo que se ve en pantalla, de arriba abajo y de izquierda a derecha, y no saltar a lugares sin sentido.", "porque": "Si el orden es caótico, quien navega con teclado se pierde. Es parte de la accesibilidad que piden los clientes corporativos.", "lista": "Cuando en cada pantalla el recorrido con Tab sigue el orden visual."}, "c75a64421cd0": {"titulo": "Ponerle nombre a los botones que solo tienen un ícono", "que": "Las personas ciegas usan un lector de pantalla que les dice en voz alta qué hay en la página. Un botón que solo tiene un ícono, como un corazón o una X, no dice nada si no tiene un nombre escondido. Hay que ponerle ese nombre a cada uno.", "porque": "Sin eso, esos botones son invisibles para quien no ve. Es de lo primero que revisan en una auditoría de accesibilidad.", "lista": "Cuando el lector de pantalla anuncia un nombre claro en cada botón de ícono."}, "045bc2227e2a": {"titulo": "Que la webapp pese menos al abrirla", "que": "Al abrir la webapp, el celular descarga un paquete con todo el código necesario para arrancar. Hay que medir cuánto pesa y bajarlo a menos de 200 KB comprimido.", "porque": "En el recinto la gente entra con datos móviles y la señal suele estar saturada. Mientras menos pese, más rápido abre para las 5.000 personas.", "lista": "Cuando la medición del código inicial da menos de 200 KB comprimido."}, "d2dd5e2e0e6c": {"titulo": "Que las imágenes se descarguen del tamaño en que se ven", "que": "Hoy algunas imágenes se descargan en su tamaño original completo, aunque en pantalla se muestren pequeñas. La idea es que cada imagen pida solo el tamaño que de verdad se va a ver.", "porque": "Las imágenes son lo que más pesa. Bajarlas hace que las pantallas abran más rápido con la red del evento.", "lista": "Cuando ninguna imagen se descarga más grande de lo que se muestra."}, "8c8002723abf": {"titulo": "Sacar 85 o más en velocidad en computador según Google", "que": "Google tiene una revisión llamada Lighthouse que califica de 0 a 100 qué tan rápido carga una página. La meta es que la webapp saque 85 o más cuando se abre en un computador.", "porque": "Es un número que los clientes corporativos pueden revisar por su cuenta. Una nota alta respalda que el producto es serio.", "lista": "Cuando Lighthouse da 85 o más en velocidad en computador en las pantallas principales."}, "704e10059daa": {"titulo": "Sacar 75 o más en velocidad en celular según Google", "que": "La misma revisión de Google (Lighthouse), pero simulando un celular, que es más exigente. La meta es 75 o más.", "porque": "La mayoría de los asistentes del 6 de diciembre va a entrar desde el celular, así que esta nota importa más que la del computador.", "lista": "Cuando Lighthouse da 75 o más en velocidad en celular en las pantallas principales."}, "ee1aa3678024": {"titulo": "Que la webapp se pueda usar en menos de 3 segundos con 4G", "que": "Medir cuánto tarda la webapp, desde que se abre, en responder a los toques, con una red 4G como la de Bogotá. La meta es menos de 3 segundos.", "porque": "Si la pantalla se ve pero no responde, la gente toca varias veces y se frustra. Con 5.000 personas en la misma red esto se nota mucho.", "lista": "Cuando la medición con 4G de Bogotá da menos de 3 segundos hasta que se puede usar."}, "e893b1cda0b9": {"titulo": "Que las listas largas se carguen por partes y se recuerden", "que": "Hoy algunas listas se arman completas en el servidor cada vez que alguien entra. La idea es que la webapp las vaya pidiendo por partes a medida que la persona baja, y que recuerde lo que ya trajo para no pedirlo de nuevo. Esto estaba previsto para después de terminar lo del tiempo real.", "porque": "Le quita trabajo al servidor y hace que volver a una pantalla sea instantáneo. Es una mejora, no algo que bloquee el evento.", "lista": "Cuando las listas largas cargan por partes al bajar y al volver a ellas no se piden otra vez."}, "502301eccf1c": {"titulo": "Prueba automática de que el chat y las preguntas llegan en vivo", "que": "Una prueba automática que abre dos ventanas a la vez, como si fueran dos personas: una escribe un mensaje o una pregunta en el streaming y la otra debe verlo aparecer. Para eso la prueba necesita tener prendido el servidor de tiempo real de verdad.", "porque": "El chat y las preguntas son lo más usado durante el streaming. Esta prueba avisa si un cambio los daña antes de que lo note el público.", "lista": "Cuando la prueba corre sola con el tiempo real prendido y pasa: lo que escribe una ventana aparece en la otra."}, "72d936bf5712": {"titulo": "Prueba automática de que las solicitudes de conexión llegan en vivo", "que": "Una prueba automática con dos ventanas abiertas a la vez: una persona le envía a otra una solicitud para conectar, y la otra debe verla llegar en el momento, sin recargar.", "porque": "El networking es de lo que más valoran los eventos corporativos. Si las solicitudes no llegan, la parte social pierde sentido.", "lista": "Cuando la prueba pasa y la solicitud aparece en la segunda ventana sin recargar."}, "0d57aa5e9a95": {"titulo": "Conectar el aviso de errores del servidor real", "que": "Sentry es un servicio que nos avisa cada vez que algo falla en la pantalla de un usuario. El código ya está listo para usarlo; falta poner la llave de producción y confirmar que los errores llegan.", "porque": "El 6 de diciembre necesitamos enterarnos de los errores en el momento, no cuando alguien se queje.", "lista": "Cuando provocamos un error a propósito en producción y aparece en Sentry."}, "7aa8b07dcd1b": {"titulo": "Ver si la prueba de la webapp incrustada sirve para el próximo cliente", "que": "Esta prueba era para meter la webapp dentro de la página de Bancolombia, y ese cliente se perdió. Queda pendiente revisar si una prueba parecida aplica para el próximo cliente.", "porque": "Por ahora no aplica. Solo vale la pena si un nuevo cliente quiere la plataforma dentro de su propia página.", "lista": "Cuando decidimos si el próximo cliente necesita esta prueba y la hacemos o la cerramos."}, "5f9b39d9075e": {"titulo": "Compartir tu puesto en el ranking en redes sociales", "que": "Que el asistente pueda compartir en sus redes el puesto que tiene en el ranking de puntos del evento. Está guardado como idea para más adelante.", "porque": "Ayudaría a que el evento se mueva en redes, pero no es necesario para el 6 de diciembre.", "lista": "Cuando un asistente puede compartir su puesto con un toque y la publicación se ve bien en la red."}, "7c90c539145d": {"titulo": "Medir la velocidad de las pantallas que piden haber entrado", "que": "La revisión de Google (Lighthouse) normalmente califica páginas públicas. Hay que correrla también con una sesión iniciada, para medir las pantallas que solo ve quien ya entró al evento. Va junto con el resto de revisiones de velocidad.", "porque": "Las pantallas que más se usan en el evento son las de adentro, así que su velocidad es la que de verdad cuenta.", "lista": "Cuando tenemos la nota de Lighthouse de las pantallas principales con sesión iniciada."}, "7c52fa4e7f66": {"titulo": "Que el módulo al que vas a pasar ya esté cargado", "que": "Mientras estás en un módulo, la webapp podría ir cargando en silencio los que están al lado, para que al tocarlos abran al instante. Se planeó, pero nunca quedó en la lista y no existe todavía.", "porque": "Hace que la plataforma se sienta rápida, que es lo primero que nota un cliente al probarla.", "lista": "Cuando al pasar de un módulo a su vecino la pantalla aparece sin espera."}, "40fe663c269f": {"titulo": "Que un módulo apagado no le pida nada al servidor", "que": "El organizador puede apagar módulos que no va a usar. Hay que confirmar que un módulo apagado de verdad no hace ningún pedido al servidor, para poder ofrecer un \"paquete mínimo\" liviano.", "porque": "Cada pedido que sobra suma carga con 5.000 personas. Y un paquete mínimo es una forma de vender a clientes que no necesitan todo.", "lista": "Cuando, con un módulo apagado, medimos que no sale ningún pedido relacionado con él."}, "75a436144acb": {"titulo": "Probar en un celular real todo lo que se igualó entre app y webapp", "que": "Hace un tiempo se igualaron muchas funciones entre la webapp y la app del celular, pero falta probarlas en un teléfono de verdad: corazones, momentos, juegos y trivia de patrocinadores, desafíos, anuncios, soporte, preguntas frecuentes, encuestas y lo del vendedor (escanear con la cámara, exportar, invitar en vivo y los bloqueos de personas vetadas o pendientes).", "porque": "Todo esto se va a usar el 6 de diciembre, y en un teléfono real aparecen fallas que en el computador no se ven.", "lista": "Cuando cada una de esas funciones se probó en un teléfono real y lo que falló quedó corregido."}, "9d87c1cab8dd": {"titulo": "Revisión final de la webapp en aparatos, navegadores y accesibilidad", "que": "Es el paquete de revisiones de cierre de la webapp: probarla en portátil, iPad y iPhone reales; en los navegadores Edge, Firefox y Safari de escritorio; confirmar que todo lo que se toca mide al menos 44 píxeles para el dedo; y pasar la revisión de velocidad de Google (Lighthouse) y el estándar de accesibilidad (WCAG).", "porque": "Es lo que separa una webapp que funciona en nuestro computador de una lista para 5.000 personas y para clientes que la auditan.", "lista": "Cuando cada punto del paquete está probado y lo que falló quedó corregido."}, "006f6a23fe56": {"titulo": "Ver la película de bienvenida completa de corrido", "que": "La webapp tiene una película de bienvenida con varias escenas. Hasta ahora se probó escena por escena. Falta verla completa de principio a fin, como la va a ver un asistente.", "porque": "Es lo primero que ve la gente al entrar. Un corte o un salto entre escenas daña la primera impresión.", "lista": "Cuando la vemos de corrido en un aparato real sin cortes ni saltos."}, "67c08b192c28": {"titulo": "Revisar las transiciones del ingreso y del inicio", "que": "El ingreso a la webapp tiene 4 pasos y la pantalla de inicio cambia según 5 momentos del evento. Hay que ver en un aparato real que el paso de uno a otro se vea suave y sin errores.", "porque": "Son las pantallas por las que pasa todo el mundo. Si se traban, se nota de inmediato.", "lista": "Cuando recorrimos los 4 pasos y los 5 estados y todos cambian bien."}, "5341c40d9ff8": {"titulo": "Probar la webapp en una red de empresa que bloquea el tiempo real", "que": "Algunas empresas bloquean en su red la conexión que usamos para lo que pasa en vivo. En ese caso la webapp debe pasar sola a un plan B: preguntar cada tanto si hay novedades. Hay que probar que ese cambio pasa sin errores.", "porque": "Los clientes corporativos tienen justo ese tipo de redes. Si el plan B falla, sus empleados no ven nada en vivo.", "lista": "Cuando, con la conexión de tiempo real bloqueada, la webapp sigue mostrando lo en vivo y no sale ningún error."}, "ce0739e75331": {"titulo": "Que el ingreso con enlace al correo aguante quedarse sin internet", "que": "Para entrar, la persona recibe un enlace en su correo. Si en ese momento se queda sin internet, la webapp debe decirle \"tu link sigue válido\" para que lo intente de nuevo, y no un error. Hay que probarlo.", "porque": "En un recinto lleno la señal va y viene. Nadie debería quedarse afuera por un corte de segundos.", "lista": "Cuando, cortando el internet a mitad del ingreso, sale el mensaje \"tu link sigue válido\" y al volver la red se puede entrar."}, "419698b36527": {"titulo": "Confirmar que la agenda de la webapp se actualiza sola", "que": "Cuando el organizador cambia una sesión (la hora, la sala), la agenda abierta en la webapp debería cambiar sola, sin que la persona recargue. Hay que probarlo con gente real.", "porque": "El día del evento siempre hay cambios de último minuto. Si la agenda no se actualiza, la gente llega a la sala equivocada.", "lista": "Cuando un cambio hecho en el admin aparece en la agenda abierta en segundos, sin recargar."}, "367530a8f0ad": {"titulo": "Que cada entrada en el kiosko mueva el Event Pulse al instante", "que": "Cuando alguien entra por el kiosko o el control de asistencia, esas pantallas deben quedar conectadas al evento en tiempo real, y el Event Pulse (la pantalla que muestra cómo va el evento) debe moverse en menos de 2 segundos.", "porque": "El organizador mira el Event Pulse para saber cuánta gente ha llegado. Si se demora, toma decisiones con datos viejos.", "lista": "Cuando, al registrar una entrada en el kiosko, el Event Pulse cambia en menos de 2 segundos."}, "0be16594fc74": {"titulo": "Confirmar que la app usa una sola conexión en vivo en el celular", "que": "La app del celular debería abrir una sola conexión de tiempo real y usarla para todo: chat, preguntas, votaciones, emojis y mensajes fijados del streaming, el muro y las encuestas. Hay que probarlo en un teléfono real y ver en el registro que solo hay una conexión.", "porque": "Si cada pantalla abre su propia conexión, con 5.000 personas el servidor de tiempo real se multiplica y se cae.", "lista": "Cuando, usando todas esas funciones en un teléfono, el registro muestra una sola conexión."}, "3bd89b8617a3": {"titulo": "Terminar de revisar la landing en el iPad contigo", "que": "La landing es la página pública del evento donde la gente se inscribe. El 12 de octubre empezamos a revisarla en el iPad. Falta terminar contigo, con el iPad de pie y acostado.", "porque": "Es la cara del evento hacia los invitados y hacia los clientes. Muchos de ellos la van a abrir en iPad.", "lista": "Cuando la landing se ve bien en el iPad en las dos posiciones y tú la apruebas."}, "b3061aa42dd8": {"titulo": "Medir en celulares reales cuánto tardan las pantallas con 4G", "que": "Usar Sentry Performance, un servicio que mide tiempos, para saber cuánto tarda cada pantalla de la app en celulares iPhone y Android reales, con una red 4G de Bogotá.", "porque": "Así sabemos con números reales, y no a ojo, si la app va a ir bien para las 5.000 personas.", "lista": "Cuando tenemos los tiempos de las pantallas principales medidos en iPhone y Android con 4G."}, "33c280d4a030": {"titulo": "Probar en el servidor la imagen del resumen del evento", "que": "El resumen del evento genera una imagen usando Chromium, un navegador que corre por dentro del servidor sin pantalla. Hay que probar que funciona en el servidor real y además ver cómo queda el diseño en una versión de prueba de la app instalada en el teléfono.", "porque": "El resumen es lo que la gente comparte después del evento. Si la imagen no se genera en el servidor, no hay nada que compartir.", "lista": "Cuando el servidor genera la imagen y se ve bien en la app de prueba del teléfono."}, "db1cdc1bdec3": {"titulo": "Que escanear en el kiosko responda en menos de una décima de segundo", "que": "Cada vez que el kiosko escanea un QR, el servidor tiene que responder. En el computador de desarrollo tarda unos 150 milisegundos; en el servidor real se espera que baje a unos 50. Hay que medirlo allá y confirmar que está por debajo de 100.", "porque": "En la entrada del 6 de diciembre se van a hacer filas. Cada fracción de segundo por persona se suma con 5.000.", "lista": "Cuando la medición en el servidor real da menos de 100 milisegundos por escaneo."}, "ca38d23dda16": {"titulo": "Que la app del staff siga escaneando sin internet", "que": "Que la app del staff pueda guardar los escaneos en el teléfono cuando no hay internet y los mande todos juntos apenas vuelva la señal.", "porque": "Solo vale la pena si en el recinto hay zonas sin wifi. Si no las hay, se puede dejar para después.", "lista": "Cuando, escaneando sin internet, al volver la señal todos los escaneos llegan al servidor sin perder ninguno."}, "762fd05c7f97": {"titulo": "Probar los avisos de la silent disco en la app instalada", "que": "La silent disco manda avisos al celular. Hay que probarlos en una versión de prueba instalada como app real, porque la app de pruebas rápidas que usamos (Expo Go) no deja recibir esos avisos.", "porque": "Si los avisos no llegan, la gente no se entera de que empezó la silent disco.", "lista": "Cuando, en la app de prueba instalada, el aviso de la silent disco llega al teléfono."}, "c670e06bc8a5": {"titulo": "Poner el efecto de vidrio de Apple en la barra de abajo de la app", "que": "Apple tiene un nuevo efecto de vidrio para las barras de navegación. Hay una herramienta para usarlo, pero por ahora solo sirve en iOS 26 y no con la forma en que está hecha nuestra app. Queda en espera hasta que la herramienta lo soporte.", "porque": "Es solo estético. No afecta el evento, es para después.", "lista": "Cuando la herramienta funcione con nuestra app y la barra de abajo use el efecto en iPhone."}, "d6d313d202e3": {"titulo": "Publicar la app en las tiendas de Apple y Google", "que": "Empaquetar la versión final de la app para Android y iPhone, tener las cuentas de las tiendas listas, enviarla y pasar la revisión de Apple y Google. Esa revisión puede tardar días o semanas.", "porque": "Si el cliente quiere la app en las tiendas para el 6 de diciembre, hay que empezar con margen. Es un riesgo de tiempo.", "lista": "Cuando la app está aprobada y se puede descargar en las dos tiendas."}, "4c6a89e99abd": {"titulo": "Registrar la firma de la app final en Firebase y apuntar el dominio", "que": "Firebase es el servicio de Google que manda notificaciones al celular. Para que acepte la app final hay que registrarle su firma digital (una especie de huella de la app). Además hay que dejar listo el dominio, es decir, que la dirección web apunte al servidor correcto.", "porque": "Sin esto, la app publicada no recibe notificaciones ni abre los enlaces del evento.", "lista": "Cuando la app final recibe una notificación de prueba y el dominio abre el servidor correcto."}, "79d483a8472d": {"titulo": "Poner al día la pantalla de documentos de la app", "que": "La pantalla de documentos de la app quedó de una versión vieja, de antes de que existiera el diseño actual. Hay que alinearla con el estilo y la forma de trabajar del resto de la app.", "porque": "Es una pantalla que se ve distinta a las demás y da sensación de producto viejo.", "lista": "Cuando la pantalla de documentos se ve y se comporta como el resto de la app."}, "85e1838191f4": {"titulo": "Borrar de la app los banners viejos que ya no se usan", "que": "En la app quedó el código de una función vieja de banners (la pantalla, el carrusel y lo que pedía al servidor) que ya no se usa. Hay que borrarlo.", "porque": "Código muerto confunde y puede romperse al cambiar otras cosas. Es limpieza, no afecta lo que ve la gente.", "lista": "Cuando ese código está borrado y la app compila y funciona igual."}, "f67a9997fefa": {"titulo": "Borrar o usar un menú de módulos que quedó escondido en la app", "que": "En la pantalla de inicio de la app se carga un menú compacto de módulos que nunca se muestra. Se descubrió el 1 de agosto. Hay que decidir si se borra o si se le da un uso.", "porque": "Es limpieza. No afecta al evento, pero deja la app más ordenada.", "lista": "Cuando el menú está borrado o se muestra con un propósito claro."}, "a9939f9c92b7": {"titulo": "En la app, tocar la sesión de un speaker te lleve a ella en la agenda", "que": "En la webapp, cuando tocas una sesión desde el perfil de un speaker, te lleva a la agenda y la resalta. Falta hacer lo mismo en la app del celular.", "porque": "Así la app y la webapp funcionan igual y la gente encuentra más rápido la charla que busca.", "lista": "Cuando en la app, al tocar una sesión de un speaker, se abre la agenda con esa sesión resaltada."}, "d6dae87aa219": {"titulo": "Confirmar si la pantalla de banners de la app se usa antes de borrarla", "que": "Antes de borrar la pantalla de banners de la app hay que revisar si alguien la abre sola o si solo existe como carrusel dentro de otra pantalla.", "porque": "Evita borrar algo que todavía se usa y romper una parte de la app.", "lista": "Cuando sabemos con certeza si se usa sola, y con eso se decide si se borra."}, "9c3dbdbc0ce6": {"titulo": "Decidir qué pasa con el resumen por evento de la app", "que": "La app tiene una pantalla de resumen para cada evento que no tiene equivalente en la webapp. Hay que decidir si se queda, se cambia o se quita. Está marcada para una segunda etapa.", "porque": "No es necesario para el 6 de diciembre. Es para ordenar la app más adelante.", "lista": "Cuando hay una decisión tomada sobre esa pantalla."}, "0cf6c2f6e524": {"titulo": "QR del asistente con el logo del evento en el centro", "que": "Que el código QR de cada asistente lleve el logo del evento en el medio, en vez de ser un QR genérico.", "porque": "Es un detalle de marca que los clientes corporativos valoran y hace ver el evento más cuidado.", "lista": "Cuando el QR sale con el logo en el centro y el kiosko lo sigue leyendo sin problema."}, "590da5fb147a": {"titulo": "Borrar del admin una sección vieja que ya no se usa", "que": "En el admin sigue existiendo una sección de \"bienvenida del evento\" que ya no se usa. Hay que borrarla.", "porque": "Es limpieza. Evita que alguien la encuentre y se confunda.", "lista": "Cuando la sección ya no existe y el admin funciona igual."}, "ff6d0b5366db": {"titulo": "Pulir Mission Control en el iPad acostado", "que": "Mission Control es la pantalla desde donde el organizador controla el evento en vivo. Hay que ajustarla para que se vea bien en un iPad acostado, de 1024 píxeles de ancho.", "porque": "Muchos organizadores manejan el evento desde un iPad. Si no se ve bien, pierden control en pleno evento.", "lista": "Cuando Mission Control se ve completo y usable en un iPad horizontal."}, "268199bba17b": {"titulo": "Subir una imagen principal distinta para computador y para celular", "que": "La imagen principal del evento (el keyvisual) hoy es una sola. La idea es que el organizador pueda subir una versión para computador y otra para celular desde el admin, y ver cómo queda cada una antes de guardar.", "porque": "Una imagen pensada para pantalla ancha se corta mal en el celular. Así el evento se ve bien en los dos.", "lista": "Cuando el admin tiene los dos espacios para subir con vista previa y cada pantalla muestra su versión."}, "bfb63e98cb5d": {"titulo": "Que la portada del evento pueda ser solo texto", "que": "Hoy la parte de arriba del evento usa una imagen. La idea es que el organizador también pueda elegir que sea solo texto, y que esa misma regla funcione igual en las 3 superficies donde se ve el evento.", "porque": "No todos los clientes tienen una imagen lista. Con texto el evento sigue viéndose bien.", "lista": "Cuando el organizador elige texto en vez de imagen y se ve bien en las 3 superficies."}, "680910db3ad3": {"titulo": "Pruebas automáticas para Mission Control", "que": "Escribir pruebas automáticas que revisen que Mission Control funciona cada vez que se cambia algo. Para hacerlas hay que simular la llave de acceso especial que usa esa pantalla. Se calcula en hora y media.", "porque": "Mission Control es lo que el organizador usa en vivo. Las pruebas avisan si un cambio lo rompe antes del 6 de diciembre.", "lista": "Cuando las pruebas existen, corren solas y pasan."}, "778bfb0fe207": {"titulo": "Colores oscuro y claro comunes para las pantallas del organizador", "que": "Las pantallas sueltas del organizador (kiosko, asistencia, Event Pulse y otras) definen sus colores cada una por su lado. La idea es crear un archivo común con los colores del modo oscuro (Noir) y del claro (Lux) para que todas lo usen.", "porque": "Así se ven como un mismo producto y un cambio de color se hace una vez y no en cada pantalla.", "lista": "Cuando el archivo común existe y las pantallas toman sus colores de ahí."}, "64e9992a0ba2": {"titulo": "Botones, ventanas y avisos iguales en las pantallas del organizador", "que": "Crear un archivo común con el diseño de los botones, las ventanas emergentes, los avisos cortos, las pantallas vacías y las tarjetas, para que todas las pantallas del organizador los usen igual.", "porque": "Hoy cada pantalla los dibuja a su manera. Unificarlos hace que el producto se vea terminado frente a un cliente.", "lista": "Cuando el archivo existe y las pantallas usan esos mismos elementos."}, "22ba4639bcc7": {"titulo": "Herramientas comunes para las pantallas del organizador", "que": "Crear un archivo común con las funciones que todas las pantallas del organizador repiten: hablar con el servidor, mostrar un aviso corto, abrir una ventana emergente y otras ayudas. Hoy cada pantalla las tiene copiadas.", "porque": "Si hay que corregir algo, se corrige una vez y no en cada pantalla. Menos riesgo de errores el día del evento.", "lista": "Cuando el archivo existe y las pantallas lo usan en vez de sus copias."}, "64e0f95565c9": {"titulo": "Que el control de asistencia use los colores del resto", "que": "La pantalla de control de asistencia usa sus propios colores, con un morado (#6366f1) que no es de nuestro diseño. Hay que pasarla a los colores comunes de las demás pantallas.", "porque": "Es una pantalla que el staff usa en la entrada y que los clientes ven. Debe verse como el resto del producto.", "lista": "Cuando la pantalla toma sus colores del archivo común y ya no aparece ese morado."}, "b55e1b43d842": {"titulo": "Que la pantalla de sesión en sala se vea bien cuando no hay nada", "que": "Hay una pantalla que se proyecta en cada sala con la sesión en curso. Cuando no hay sesión, su mensaje de \"no hay nada\" se ve distinto al de las demás pantallas. Hay que alinearlo.", "porque": "Esa pantalla la ve todo el público en la sala, así que tiene que verse cuidada.", "lista": "Cuando, sin sesión en curso, la pantalla muestra el mismo estilo de pantalla vacía que las demás."}, "ba8e85b74c68": {"titulo": "Que el Event Pulse use los mismos colores que las demás pantallas", "que": "El Event Pulse, la pantalla que muestra cómo va el evento, nombra sus colores distinto a las demás. Hay que alinearlo con los colores del modo oscuro (Noir) y claro (Lux) que usa el resto.", "porque": "Así se ve igual que el resto del producto y un cambio de color llega a todas las pantallas a la vez.", "lista": "Cuando el Event Pulse se ve bien en oscuro y en claro usando los colores comunes."}, "63edba13a64e": {"titulo": "Hacer más fluido el orbe de preguntas frecuentes de la app", "que": "En la app, las preguntas frecuentes tienen un orbe animado. Hoy está hecho con una técnica más pesada; la idea es rehacerlo con otra (Skia) que dibuja directo en la pantalla y es más liviana. Es solo de apariencia.", "porque": "No cambia nada para el evento. Es un pulido para después.", "lista": "Cuando el orbe se ve igual o mejor y corre fluido en un teléfono de gama media."}, "a0a3a334da76": {"titulo": "Mapa del lugar del evento en la app", "que": "Una sección con el plano del recinto para que la gente encuentre las salas y los stands. Depende de si el evento tiene un plano disponible.", "porque": "Ayuda mucho en eventos grandes, pero solo tiene sentido si el cliente entrega el plano. Es para más adelante.", "lista": "Cuando la app muestra el plano de un evento y se pueden ubicar las salas en él."}, "bcac257e8272": {"titulo": "Recortar la foto de perfil en círculo dentro de la app", "que": "Cuando alguien sube su foto de perfil en la app, que pueda recortarla en forma de círculo, con una pantalla de recorte en modo oscuro.", "porque": "Hace que las fotos de perfil se vean mejor. Es un detalle para después del evento.", "lista": "Cuando al subir una foto aparece el recorte circular y la foto queda guardada así."}, "e469dd74aef4": {"titulo": "¿Cuándo abre el registro de asistentes?", "que": "La fecha en que la gente empieza a inscribirse decide cuándo tiene que estar listo el servidor de verdad, con el correo verificado y la protección anti-robots real. Si el registro abre en noviembre, el servidor tiene que estar arriba antes de esa fecha.", "porque": "Todo el calendario de montaje para el 6 de diciembre se arma hacia atrás desde esta fecha.", "lista": "Cuando decidas la fecha de apertura del registro."}, "558e471f5327": {"titulo": "¿El cliente del 6 de diciembre ya está confirmado?", "que": "Hay dos caminos. Si el cliente está confirmado, vale la pena pagar las pruebas de servidor y medir que aguante 5.000 personas. Si no, conviene priorizar un demo que sirva para vender.", "porque": "Define en qué se gasta el tiempo y la plata de aquí a diciembre.", "lista": "Cuando decidas si el evento va con cliente confirmado o si nos enfocamos en el demo."}, "83f163d0509d": {"titulo": "¿Te sirve el costo actual de las pruebas de servidor?", "que": "Hoy las pruebas cuestan unos $120 al mes por las bases de datos y unos $6,5 por día por las máquinas prendidas. Hay que confirmar esos números con el inventario de lo que tenemos guardado antes de prender algo.", "porque": "Las pruebas para 5.000 personas cuestan plata; conviene saber cuánto antes de empezar.", "lista": "Cuando confirmes el costo después de revisar el inventario de máquinas y bases."}, "a595905b3fb3": {"titulo": "¿Las pruebas de carga y de caída son obligatorias antes de un evento?", "que": "Antes de un evento podemos simular mucha gente entrando a la vez y apagar una máquina a propósito para ver si la plataforma sigue en pie. La propuesta es que eso sea obligatorio antes de un evento real y opcional cuando solo montamos un demo.", "porque": "Esas pruebas son las que nos dan tranquilidad para el 6 de diciembre, pero cuestan tiempo y plata en cada demo.", "lista": "Cuando decidas en qué casos son obligatorias."}, "a47ab4cadb43": {"titulo": "¿Cuándo damos la plataforma por sana, en alerta o en problemas?", "que": "El canario es un asistente de mentira que usa la plataforma todo el tiempo y mide qué tan rápido responde. Hay una propuesta de límites: por ejemplo, una pantalla que carga en menos de 300 milisegundos es verde, hasta 800 es amarillo y más es rojo; y cualquier error que vea la gente es rojo. Falta que tú los apruebes o ajustes.", "porque": "Con esos límites sabemos, sin discutir, si la plataforma está lista para 5.000 personas.", "lista": "Cuando apruebes o ajustes la tabla de verde, amarillo y rojo."}, "af7afc7b195c": {"titulo": "¿Apruebas el reproductor que te sigue por toda la webapp?", "que": "Hoy el video en vivo se cierra apenas sales de su pantalla. La propuesta es un reproductor que se quede contigo mientras navegas. Falta aprobar cómo se arma y decidir si las tarjetas de las otras salas en vivo muestran una miniatura del video, o rotan cada 8 segundos si son varias, para no cargar de más el equipo.", "porque": "Es una mejora y no bloquea diciembre, pero hace que el en vivo se sienta en vivo y no como un directorio.", "lista": "Cuando apruebes la propuesta y decidas qué muestran las tarjetas de las otras salas."}, "6e2267c3a1eb": {"titulo": "¿Mostramos la agenda en cuadrícula por auditorio, como Bintec?", "que": "En eventos con varias salas, Bintec mostraba la agenda como una tabla: las horas en un lado y cada sala en una columna. Así se ve de un vistazo qué pasa en cada sala a la misma hora.", "porque": "En un evento grande con varias salas ayuda a la gente a elegir rápido, y es algo que el mercado ya conoce.", "lista": "Cuando decidas si la agenda tiene esa vista o no."}, "83405f31c0ae": {"titulo": "¿Cambiamos \"Highlights\" por \"Destacados\" en el admin?", "que": "En el admin hay una sección que se llama en inglés, \"Highlights\". La propuesta es llamarla \"Destacados\" para que todo quede en español.", "porque": "Es un detalle pequeño, pero un admin en un solo idioma se ve más cuidado al venderlo.", "lista": "Cuando decidas el nombre."}, "117769d32b0a": {"titulo": "¿Dónde va en el admin el botón para dar puntos a mano?", "que": "El sistema de puntos ya permite darle puntos a una persona a mano, pero no hay ningún botón en el admin para hacerlo. Hay que decidir en qué pantalla va.", "porque": "En pleno evento puede hacer falta premiar a alguien al momento sin pedirle ayuda a un programador.", "lista": "Cuando decidas en qué parte del admin va."}, "713ce8e1f7df": {"titulo": "¿Vuelve la opción de Silent Disco al formulario de sesión?", "que": "Antes, al crear una sesión en el admin, se podía marcar si era Silent Disco (con audífonos). Esa opción ya no está en el formulario. Hay que decidir si vuelve.", "porque": "Si un cliente quiere sesiones con audífonos, el organizador necesita poder marcarlas él mismo.", "lista": "Cuando decidas si la opción vuelve o se queda por fuera."}, "dc30c89e5aec": {"titulo": "¿Alguien puede cambiar la calificación que ya le dio a una sesión?", "que": "Hoy, cuando una persona califica una sesión de la agenda, la calificación queda fija y no la puede cambiar. Hay que decidir si se deja así o si puede volver a calificar.", "porque": "Es una duda que va a salir con 5.000 personas calificando; mejor tener la respuesta decidida.", "lista": "Cuando decidas si la calificación se puede cambiar o queda fija."}, "265d40089c10": {"titulo": "¿Usamos o quitamos avisos en vivo que nadie está escuchando?", "que": "El servidor manda avisos en tiempo real cuando una sesión empieza, termina o se cancela, cuando cambia la agenda y cuando cambia la ocupación de una sala. Pero ninguna pantalla los usa. Hay dos opciones: conectarlos para que las pantallas se actualicen solas, o quitarlos.", "porque": "Mandar avisos que nadie usa es carga de más con 5.000 personas; usarlos haría la agenda más viva.", "lista": "Cuando decidas cuáles se conectan y cuáles se quitan."}, "663d60b419f7": {"titulo": "¿Qué se muestra en grande en la pantalla de ingresos en vivo?", "que": "Event Pulse es la pantalla que muestra en vivo cómo va entrando la gente. Hay que decidir qué va arriba en grande: tarjetas que agrupan, por ejemplo, \"los últimos 10 ingresos\", y una tarjeta para una persona en particular. Primero se ve en lab, tú apruebas y luego se programa.", "porque": "Es una pantalla que se proyecta y todos la ven; si está bien armada, ayuda a vender el producto.", "lista": "Cuando apruebes el lab con las reglas de qué se muestra arriba."}, "b5bebf4a16fe": {"titulo": "¿Terminamos o quitamos las páginas propias del organizador?", "que": "Existe la idea de que el organizador meta sus propias páginas web dentro de la webapp. Está a medias: falta el acceso para que la gente llegue a ellas. Hay dos opciones: construir ese acceso o borrar lo que hay. Se dejó para después de montar el servidor.", "porque": "No hace falta para diciembre; dejarlo a medias solo estorba.", "lista": "Cuando decidas si se construye el acceso o se quita."}, "43902edfc188": {"titulo": "Reescribir el manual del organizador con el tono aprobado", "que": "El manual del organizador arrancó con una página de prueba sobre Encuestas. Hay que reescribirla en lenguaje natural y sin tecnicismos, como pediste, y luego escribir el resto del manual a partir del inventario de funciones ya revisado.", "porque": "Un cliente necesita poder manejar su evento sin llamarnos; el manual es parte de lo que se vende.", "lista": "Cuando apruebes la página de Encuestas y las demás estén escritas con el mismo tono."}, "d31c07898b5d": {"titulo": "Listas que aparecen en cascada y gestos de deslizar con vibración", "que": "Detalles de movimiento para la webapp: que los elementos de una lista aparezcan uno tras otro, y que se pueda deslizar con el dedo sobre una tarjeta y sentir una vibración leve, como en una app nativa.", "porque": "No hace falta para diciembre; es pulido que la hace sentir más premium.", "lista": "Cuando las listas aparecen en cascada y el deslizar vibra en un celular real."}, "810e44b37b16": {"titulo": "Avisar las mayúsculas activadas y cuándo se puede reenviar el enlace", "que": "Dos ayudas al entrar a la webapp: avisar cuando la persona tiene las mayúsculas activadas al escribir la contraseña, y mostrar una cuenta regresiva de cuánto falta para poder pedir otra vez el enlace de acceso.", "porque": "No hace falta para diciembre; evita algunas dudas al entrar.", "lista": "Cuando ambos avisos se ven al entrar a la webapp."}, "5e300d878ef2": {"titulo": "Resumen del evento y certificado en una pantalla propia", "que": "Hoy el resumen de lo que viviste en el evento y el certificado no tienen una pantalla propia en la webapp. La idea es darles su espacio aparte.", "porque": "No hace falta para diciembre; sirve para el cierre del evento y para que la gente lo comparta.", "lista": "Cuando el resumen y el certificado abren en su propia pantalla."}, "a8005e15ca61": {"titulo": "Páginas que el organizador crea y se ven en la webapp", "que": "Que el organizador pueda armar sus propias páginas de información y que aparezcan en la webapp. Quedó para después, al cerrar ese módulo.", "porque": "No hace falta para diciembre; sirve si un cliente quiere publicar información extra.", "lista": "Cuando una página creada en el admin se ve en la webapp."}, "48319522c3eb": {"titulo": "Vista previa al compartir enlaces y mapa del sitio para buscadores", "que": "Cuando alguien comparte un enlace de la webapp por WhatsApp o redes, que salga con imagen y título. Y que exista el mapa del sitio que usan buscadores como Google.", "porque": "No hace falta para diciembre; mejora cómo se ven los enlaces al compartirlos.", "lista": "Cuando un enlace compartido muestra imagen y título correctos."}, "ff9b7b0824cc": {"titulo": "Que las listas largas carguen por partes y se recuerden", "que": "Cambiar la forma en que la webapp carga las listas largas para que traiga de a pedazos mientras bajas y guarde lo que ya trajo, en vez de pedirlo todo de nuevo cada vez.", "porque": "No hace falta para diciembre; hace la navegación más fluida y le quita algo de carga al servidor.", "lista": "Cuando las listas largas cargan por partes y al volver no se recargan desde cero."}, "c5277de22b81": {"titulo": "Terminar el inicio con los próximos eventos del organizador", "que": "Completar la pantalla de inicio para que muestre los próximos eventos del mismo organizador, y que su ambiente cambie según si el evento no ha empezado, está en vivo o ya terminó.", "porque": "No hace falta para diciembre; ayuda a que el organizador lleve a su gente de un evento al siguiente.", "lista": "Cuando el inicio muestra los próximos eventos y cambia según el estado del evento."}, "a052fda01ab4": {"titulo": "Que todas las búsquedas funcionen de la misma forma", "que": "Las búsquedas de la plataforma las resuelve el servidor, pero cada una pide los datos de forma distinta. La idea es que todas usen la misma forma.", "porque": "No hace falta para diciembre; hace más fácil y seguro agregar búsquedas nuevas.", "lista": "Cuando todas las búsquedas usan la misma forma y siguen dando los mismos resultados."}, "166177b892ef": {"titulo": "Poder cancelar una solicitud de contacto ya enviada", "que": "Hoy, si le mandas a alguien una solicitud para conectar en el evento, no la puedes retirar. La idea es poder cancelarla antes de que la acepten.", "porque": "No hace falta para diciembre; evita solicitudes enviadas por error.", "lista": "Cuando una solicitud enviada se puede cancelar y desaparece para la otra persona."}, "9bcd64802447": {"titulo": "Mostrar qué tanto coincides con cada contacto sugerido", "que": "La plataforma ya sugiere personas para conectar. La idea es darle a cada sugerencia un puntaje que diga qué tanto coinciden contigo.", "porque": "No hace falta para diciembre; ayuda a que la gente decida a quién escribirle.", "lista": "Cuando cada contacto sugerido trae su puntaje."}, "9ba82a26ebf8": {"titulo": "Ver el ranking completo, más allá de los primeros 50", "que": "Hoy el ranking de puntos muestra máximo 50 personas. La idea es que se pueda seguir bajando para ver el resto, por partes.", "porque": "No hace falta para diciembre, pero con 5.000 personas el que va en el puesto 300 también quiere verse.", "lista": "Cuando el ranking deja ver más allá del puesto 50."}, "75d018ba686e": {"titulo": "Avisar al instante cuántos puntos ganaste y por qué", "que": "Cada vez que alguien gana puntos, que le llegue al momento un aviso con cuántos ganó, por qué acción y cuántos lleva en total.", "porque": "No hace falta para diciembre; hace que ganar puntos se sienta en el momento.", "lista": "Cuando al ganar puntos llega el aviso con la cantidad, la acción y el total."}, "957d30c440f2": {"titulo": "Mandar mensajes por WhatsApp a los asistentes", "que": "Conectar la plataforma con WhatsApp para mandar avisos a los asistentes por ahí. ICE360 lo tiene por $850K COP. Hay que evaluar si vale la pena.", "porque": "No hace falta para diciembre; puede ser un argumento de venta si los clientes lo piden.", "lista": "Cuando decidamos si vale la pena y, si sí, un aviso de prueba llega por WhatsApp."}, "614b4300e84e": {"titulo": "Mensajes de texto como respaldo", "que": "Si un aviso no le llega a alguien por los canales normales, mandárselo por mensaje de texto al celular.", "porque": "No hace falta para diciembre; sirve si un cliente necesita asegurarse de que todos reciban un aviso importante.", "lista": "Cuando un aviso que no llegó por los canales normales llega por mensaje de texto."}, "89a829c1065f": {"titulo": "Dejar por escrito cómo funciona el tiempo real", "que": "Escribir un documento que explique cómo funciona la parte que hace que los cambios lleguen al instante a todos, como el chat, los avisos y la agenda en vivo.", "porque": "Si mañana entra otra persona al equipo, o algo falla en pleno evento, se entiende rápido dónde mirar.", "lista": "Cuando el documento existe y explica cada pieza del tiempo real."}, "a3d94c59ccff": {"titulo": "Preparar la app para publicarla con la marca de cada cliente", "que": "Ordenar la configuración de la app del celular para que se pueda sacar una versión con el nombre, el logo y los colores de cada cliente, cada uno en su propia carpeta.", "porque": "No hace falta para diciembre; es lo que permite vender la app con la marca del cliente.", "lista": "Cuando se puede generar la app de un cliente cambiando solo su carpeta."}, "7fb5069eccc7": {"titulo": "Pantallas en el lugar del evento", "que": "Mostrar en las pantallas del lugar del evento información como la agenda, los avisos o los patrocinadores.", "porque": "No hace falta para diciembre; sirve si un cliente lo pide.", "lista": "Cuando una pantalla del lugar muestra la información del evento en vivo."}, "3fd558f4bd29": {"titulo": "Imprimir escarapelas físicas", "que": "Poder imprimir las escarapelas de los asistentes, por ejemplo en la entrada del evento.", "porque": "No hace falta para diciembre; sirve si un cliente lo pide.", "lista": "Cuando se puede imprimir la escarapela de un asistente desde la plataforma."}, "26c045893c78": {"titulo": "Vender la plataforma como servicio a muchos organizadores", "que": "Varias piezas para que muchos organizadores usen la plataforma por su cuenta: que cada uno tenga su espacio separado, cobrar con Stripe, que una persona pueda descargar sus datos como exige la ley europea (GDPR) y conectar juegos hechos en Unity.", "porque": "No hace falta para diciembre; es el camino para cobrar por suscripción más adelante.", "lista": "Cuando decidamos arrancar esa fase y cada pieza tenga su propia tarea."}, "6fba66d08244": {"titulo": "Un mismo evento en varias sedes, cada una con su agenda", "que": "Que un evento pase en varios lugares a la vez, cada uno con su propia agenda. Bancolombia lo necesitaba para Colombia y Panamá.", "porque": "No hace falta para diciembre; sirve si un cliente grande hace eventos en varias sedes.", "lista": "Cuando un evento puede tener varias sedes con agendas separadas."}}, "sug": {"2d375ca3809c": {"p": "ya", "o": 5, "por": "Es el arranque de todo lo de servidor: sin esto nada se puede medir y faltan 51 días."}, "2cc01d6b118e": {"p": "ya" function reorder(listEl, p, moved){ [...listEl.querySelectorAll("[data-id]")].forEach((n,i) => { const id = n.dataset.id; const before = JSON.stringify(P[id]||{}); const wasSug = isSug(id); const cur = p || pr(id); P[id] = Object.assign({}, P[id]||{}, {o:i}); if (cur === "sin") delete P[id].p; else P[id].p = cur; if (id !== moved && wasSug) P[id].sug = true; else delete P[id].sug; if (JSON.stringify(P[id]) !== before) touch(id); }); }

function card(t){
  const c = el("div",{cls:"card"+(S.sel===t.id?" sel":""),"data-id":t.id,role:"button",tabindex:"0"});
  c.append(el("div",{cls:"ct",text:TT(t)}));
  if (DD(t)) c.append(el("div",{cls:"cd",text:DD(t)}));
  const m = el("div",{cls:"cm"});
  if (S.mod === "ejemplos") m.append(el("span",{cls:"lbl",text:MODN[t.mod]}));
  const ob = openBlockers(t); if (ob.length) m.append(el("span",{cls:"pill blk",text:"Bloqueada por " + (ob.length === 1 ? "1 tarea" : ob.length + " tareas")}));
  if (t.parcial) m.append(el("span",{cls:"pill par",text:"Falta medir"}));
  if (t.etiqueta) m.append(el("span",{cls:"pill "+TAG[t.etiqueta][0],text:TAG[t.etiqueta][1]}));
  if (P[t.id] && P[t.id].nota) m.append(el("span",{cls:"pill nota",text:"Con nota"}));
  if (isSug(t.id) && SUG[t.id]) m.append(el("span",{cls:"pill sug",text:"Sugerida por Claude"}));
  c.append(m);
  c.addEventListener("click", () => openDetail(t.id));
  c.addEventListener("keydown", e => { if (e.key === "Enter") openDetail(t.id); });
  return c;
}

function renderHead(){

    el("div",{cls:"kpi"}, el("b",{text:v.filter(t=>!isSug(t.id)).length+"/"+v.length}), el("span",{text:"decididas por ti"})));

  document.getElementById("segBlk").replaceChildren(...[["todas","Todas"],["libres","Se pueden hacer ya ("+nl+")"],["bloq","Bloqueadas ("+nb+")"]].map(([v,l]) => el("button",{cls:S.blk===v?"on":"",onclick:()=>{S.blk=v;save();render();}},l)));
  document.getElementById("segOrd").replaceChildren(...[["normal","Normal"],["cantidad","Más tareas"],["urgencia","Más urgentes"],["bloqueos","Más bloqueadas"]].map(([v,l]) => el("button",{cls:S.ord===v?"on":"",onclick:()=>{S.ord=v;save();render();}},l)));
  const m = document.getElementById("mods");
  m.className = "mods wrap";
  m.style.display = S.filt === "C1" ? "none" : "";
  if (S.filt === "C1") return;
  m.replaceChildren(el("button",{cls:"mod-chip"+(S.mod==="todos"?" on":""),onclick:()=>{S.mod="todos";render();}},"Todos",el("span",{text:String(T.length)})),
    el("button",{cls:"mod-chip"+(S.mod==="ejemplos"?" on":""),onclick:()=>{S.mod="ejemplos";render();}},"Ejemplos de lenguaje",el("span",{text:String(ej)})),
    ...MODS.map(x => el("button",{cls:"mod-chip"+(S.mod===x.k?" on":""),onclick:()=>{S.mod=x.k;render();}}, x.t, el("span",{text:String(x.n)}))));
}
function closeSheet(){ const sh = document.getElementById("sheet"); if (sh) sh.hidden = true; if (!S.sel) document.getElementById("scrim").hidden = true; }

function renderA(view){
  const wrap = el("div",{cls:"A tabsmode"});
  const tabs = document.getElementById("atabs"); tabs.replaceChildren();
  for (const c of COLS) {
    const items = visible().filter(t => pr(t.id) === c.v).sort(byOrd);
    tabs.append(el("button",{cls:"mod-chip"+(S.acol===c.v?" on":""),onclick:()=>{S.acol=c.v;render();}}, c.l, el("span",{text:String(items.length)})));
    const col = el("section",{cls:"colm"+(S.acol===c.v?" cur":"")});
    col.append(el("div",{cls:"colh"}, el("div",{cls:"colh-row"}, el("h2",{text:c.l}), el("span",{cls:"n "+c.v,text:String(items.length)})), el("p",{text:c.h})));
    const body = el("div",{cls:"colb","data-p":c.v});
    if (c.v === "sin" && S.mod === "todos") {
      // agrupado por modulo para que la columna larga se pueda leer
      let last = null;
      for (const t of items.sort((a,b) => MODS.findIndex(m=>m.k===a.mod) - MODS.findIndex(m=>m.k===b.mod) || byOrd(a,b))) {
        if (t.mod !== last) { last = t.mod; body.append(el("div",{cls:"grp",text:MODN[t.mod]})); }
        body.append(card(t));
      }
    } else items.forEach(t => body.append(card(t)));
    if (!items.length) body.append(el("div",{cls:"empty-drop",text:"Arrastra tareas aquí"}));
    col.append(body); wrap.append(col);
  }
  view.append(wrap);
  wrap.querySelectorAll(".colb").forEach(b => sortables.push(Sortable.create(b, Object.assign({}, SORT_OPTS, {disabled: ro(), group:"A", draggable:".card", filter:".grp,.empty-drop",
    onEnd: e => { dragging = false; reorder(e.to, e.to.dataset.p, e.item.dataset.id); if (e.from !== e.to) reorder(e.from, null, e.item.dataset.id); render(); }}))));
}

function renderB(view){
  const wrap = el("div",{cls:"B"});
  for (const m of MODS) {
    if (S.mod !== "todos" && S.mod !== m.k) continue;
    const items = T.filter(t => t.mod === m.k).sort(byOrd);
    const g = el("section",{cls:"bgroup"+(S.closed[m.k]?" closed":"")});
    const dist = el("div",{cls:"dist"});
    for (const c of COLS.slice(1)) { const n = items.filter(t=>pr(t.id)===c.v).length; if (n) { const i = el("i"); i.style.width = (100*n/items.length)+"%"; i.style.background = "var(--"+(c.v==="despues"?"desp":c.v==="descartar"?"no":c.v)+")"; dist.append(i); } }
    g.append(el("button",{cls:"bgh",onclick:()=>{S.closed[m.k]=!S.closed[m.k]; save(); render();}}, el("h2",{text:m.t}), el("span",{cls:"cnt",text:items.filter(t=>pr(t.id)!=="sin").length+" de "+items.length+" priorizadas"}), dist, el("span",{cls:"chev",text:"⌄"})));
    const rows = el("div",{cls:"brows","data-m":m.k});
    for (const t of items) {
      const r = el("div",{cls:"brow","data-id":t.id});
      r.append(el("span",{cls:"hd",text:"⠿","aria-label":"Arrastrar para ordenar"}));
      r.append(el("div",{cls:"bt",onclick:()=>openDetail(t.id)}, el("b",{text:t.titulo}), el("span",{text:t.desc||" "})));

      r.append(el("button",{cls:"ppick "+p,onclick:e=>openMenu(e.currentTarget,t.id)}, p==="sin" ? "Sin decidir" : COLN[p]));

      rows.append(r);

    g.append(rows); wrap.append(g);
    sortables.push(Sortable.create(rows, Object.assign({}, SORT_OPTS, {disabled: ro(), handle:".hd", delay:0, onEnd: e => { dragging = false; reorder(e.to, null); }})));
  }
  view.append(wrap);
}

function renderC(view){
  const wrap = el("div",{cls:"C"});
  const head = el("div",{cls:"chead"});
  COLS.forEach(c => head.append(el("div",{}, el("h2",{text:c.l}), el("span",{cls:"n "+c.v,text:String(visible().filter(t=>pr(t.id)===c.v).length)}))));
  wrap.append(head);
  const score = k => { const its = T.filter(t => t.mod === k && inMod(t) && inBlk(t));
    return S.ord === "cantidad" ? its.length : S.ord === "urgencia" ? its.filter(t => ["ya","antes"].includes(pr(t.id))).length : S.ord === "bloqueos" ? its.filter(blocked).length : 0; };
  const lanes = S.ord === "normal" ? MODS : [...MODS].sort((a,b) => score(b.k) - score(a.k));
  for (const m of lanes) {
    if (S.mod !== "todos" && S.mod !== "ejemplos" && S.mod !== m.k) continue;
    const items = T.filter(t => t.mod === m.k && inMod(t) && inBlk(t));
    if (!items.length) continue;
    const lane = el("section",{cls:"lane"+(S.closed["c"+m.k]?" closed":"")});
    const nbl = items.filter(blocked).length;
    lane.append(el("button",{cls:"laneh",onclick:()=>{S.closed["c"+m.k]=!S.closed["c"+m.k]; save(); render();}}, el("span",{cls:"chev",text:"⌄"}), el("h3",{text:m.t}), el("span",{cls:"cnt",text:items.length+" tareas" + (nbl ? ", " + nbl + " bloqueadas" : "")})));
    const md = MODDEP[m.k];
    if (md) { const open = T.filter(t => t.mod === md.mod && !["descartar"].includes(pr(t.id))).length; if (open) lane.append(el("div",{cls:"alert"}, el("b",{text:"Depende de " + MODN[md.mod]}), el("span",{text: md.texto + " Quedan " + open + " tareas ahí."}))); }
    const cells = el("div",{cls:"cells"});
    for (const c of COLS) {
      const cell = el("div",{cls:"cell","data-p":c.v,"data-m":m.k,"data-label":c.l});
      items.filter(t => pr(t.id) === c.v).sort(byOrd).forEach(t => cell.append(card(t)));
      cells.append(cell);
    }
    lane.append(cells); wrap.append(lane);
    cells.querySelectorAll(".cell").forEach(cell => sortables.push(Sortable.create(cell, Object.assign({}, SORT_OPTS, {disabled: ro(), group:"lane-"+m.k, draggable:".card",
      onEnd: e => { dragging = false; reorder(e.to, e.to.dataset.p, e.item.dataset.id); if (e.from !== e.to) reorder(e.from, null, e.item.dataset.id); render(); }}))));
  }
  view.append(wrap);
}

function openMenu(btn, id){
  closeMenu();
  const r = btn.getBoundingClientRect();
  const m = el("div",{cls:"menu",id:"menu",role:"menu"});
  COLS.forEach(c => m.append(el("button",{role:"menuitem",onclick:()=>{ setPrio(id, c.v); closeMenu(); render(); }}, c.l)));
  document.body.append(m);
  const top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 12), left = Math.min(r.left, innerWidth - m.offsetWidth - 12);
  m.style.top = top + "px"; m.style.left = Math.max(12,left) + "px";
  setTimeout(() => document.addEventListener("pointerdown", outside, {once:true}), 0);
  function outside(e){ if (!m.contains(e.target)) closeMenu(); else document.addEventListener("pointerdown", outside, {once:true}); }
}
function closeMenu(){ const m = document.getElementById("menu"); if (m) m.remove(); }

function openDetail(id){ S.sel = id; render(); }
function closeDetail(){ S.sel = null; render(); }
function renderDetail(){
  const d = document.getElementById("detail"), sc = document.getElementById("scrim");
  const t = T.find(x => x.id === S.sel);
  if (!t) { d.hidden = true; sc.hidden = true; return; }
  d.hidden = false; sc.hidden = innerWidth >= 900;
  const p = pr(t.id);
  d.replaceChildren(...[
    el("button",{cls:"dx",onclick:closeDetail},"Cerrar"),
    el("div",{cls:"dmod",text:MODN[t.mod]}),
    el("h2",{text:TT(t)}),
    ...((S.lang === "simple" && SIMPLE[t.id]) ? [
      el("div",{cls:"lsec"}, el("small",{text:"Qué es"}), el("div",{text:SIMPLE[t.id].que})),
      el("div",{cls:"lsec"}, el("small",{text:"Por qué importa"}), el("div",{text:SIMPLE[t.id].porque})),
      el("div",{cls:"lsec"}, el("small",{text:"Cuándo está lista"}), el("div",{text:SIMPLE[t.id].lista}))
    ] : [t.desc ? el("div",{cls:"ddesc",text:t.desc}) : null]),
    openBlockers(t).length ? el("div",{cls:"dk"}, el("small",{text:"Antes hay que terminar"}), el("div",{cls:"deps"}, ...openBlockers(t).map(b => el("button",{onclick:()=>openDetail(b.id)}, TT(b))))) : null,
    (() => { const w = T.filter(x => (x.dep||[]).includes(t.id)); return w.length ? el("div",{cls:"dk"}, el("small",{text:"Cuando esté lista desbloquea " + w.length + (w.length === 1 ? " tarea" : " tareas")}), el("div",{text: w.slice(0,6).map(TT).join(", ") + (w.length > 6 ? " y " + (w.length-6) + " más" : "")})) : null; })(),
    SUG[t.id] ? el("div",{cls:"lsec"}, el("small",{text: isSug(t.id) ? "Por qué la puse en " + COLN[SUG[t.id].p] : "Yo la había puesto en " + COLN[SUG[t.id].p]}), el("div",{text:SUG[t.id].por})) : null,
    (isSug(t.id) && SUG[t.id] && !ro()) ? el("button",{cls:"dx",style:"align-self:flex-start",onclick:()=>{ setPrio(t.id, SUG[t.id].p); render(); }},"Confirmar la sugerencia") : null,
    el("div",{cls:"dk"}, el("small",{text:"Prioridad"}), (() => { const g = el("div",{cls:"dprio"}); COLS.slice(1).forEach(c => g.append(el("button",{cls:c.v+(p===c.v && !isSug(t.id)?" on":""),onclick:()=>{ setPrio(t.id, p===c.v?"sin":c.v); render(); }}, c.l))); return g; })()),
    t.etiqueta ? el("div",{cls:"dk"}, el("small",{text:"Dónde se hace"}), el("div",{text:TAG[t.etiqueta][1]})) : null,

    el("div",{cls:"dk"}, el("small",{text:"Nota"}), (() => { const n = el("textarea",{cls:"dnote",placeholder:"Por qué, de qué depende, qué cambia",id:"nota-"+t.id}); n.value = (P[t.id]&&P[t.id].nota)||""; if (ro()) n.disabled = true;
      n.addEventListener("focus",()=>{ typing = true; });
      n.addEventListener("blur",()=>{ typing = false; if (pendingRender) { pendingRender = false; render(); } });
      n.addEventListener("input",()=>{ P[t.id]=Object.assign({},P[t.id]||{},{nota:n.value}); touch(t.id); }); return n; })()),
    el("details",{cls:"tech"}, el("summary",{},"Ver el texto técnico"), el("div",{cls:"tbody"},
      el("div",{}, el("b",{text:t.titulo})),
      t.desc ? el("div",{text:t.desc}) : null,
      el("div",{text:"Origen: " + t.secT + (t.sub ? ", " + t.sub : "")}),
      t.fuentes.length ? el("div",{text:"Fuente: " + t.fuentes.join(", ")}) : null))
  ].filter(Boolean));
}
document.getElementById("scrim").addEventListener("click", () => { const sh = document.getElementById("sheet"); if (!sh.hidden) closeSheet(); else closeDetail(); });

function render(){
  document.getElementById("atabs").style.display = "none";
  killSortables(); closeMenu();
  const view = document.getElementById("view"); const sx = view.scrollLeft, sy = view.scrollTop;
  view.replaceChildren();
  renderHead();
  ({A:renderA,B:renderB,C:renderC})[S.dir](view);
  view.scrollLeft = sx; view.scrollTop = sy;
  renderDetail();
}
addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); closeSheet(); closeDetail(); } });
render();
setStatus("Cargando las prioridades guardadas.");
(async function(){
  const use = window.claude && window.claude.use;
  if (!use) { setStatus("Abre esta página desde claude.ai para guardar prioridades. Aquí solo se puede leer."); DB = false; canWrite = false; render(); return; }
  const [db, user] = await Promise.all([use("db"), use("user")]);
  if (!db) { setStatus("Inicia sesión en claude.ai para guardar prioridades. Aquí solo se puede leer."); DB = false; canWrite = false; render(); return; }
  DB = db; canWrite = true;
  try { const w = user ? await user.can("data.write") : null; if (w === false) canWrite = false; } catch(e) {}
  db.collection("prioridades").onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) { const v = d.data(); if (v) m[d.id] = v; }
    for (const id of dirty) if (P[id]) m[id] = P[id];
    P = m; setStatus(canWrite ? "" : "Puedes ver el tablero, pero no cambiarlo con esta cuenta.");
    if (typing || dragging) { pendingRender = true; return; }
    render();
  }, () => setStatus("Se perdió la conexión con lo guardado. Recarga la página."));
  flush();
})();
})();
</script>
