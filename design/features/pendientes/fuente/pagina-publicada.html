<title>Pendientes EventOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Urbanist:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
/* Tablero de pendientes EventOS, version Lux (decision Kamilo 2026-10-16). Noir/Lux White Chrome de EventOS (como Data Center):
   chrome blanco/tinta, color solo para datos (prioridades). Noir con bordes luminosos sin sombra;
   Lux con sombras suaves sin bordes. Plus Jakarta para titulos y numeros, Urbanist para todo lo demas. */
:root{
  --bg:#0a0a0b; --col:#111113; --card:#17171a; --card-h:#1d1d21; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --t1:#f2f1ee; --t2:#a09fa6; --t3:#6b6a71; --ink:#f2f1ee; --onink:#0a0a0b; --shadow:none;
  --ya:#ff8a4c; --ya-s:rgba(255,138,76,.13); --antes:#7ea6ff; --antes-s:rgba(126,166,255,.13);
  --desp:#9a9ca6; --desp-s:rgba(154,156,166,.13); --no:#f26d78; --no-s:rgba(242,109,120,.12); --sin:#6b6a71; --sin-s:rgba(255,255,255,.05);
  --plat:#b5a68b;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-s:10px;
  color-scheme:dark;
}
:root{
  --bg:#f3f3f1; --col:#e9e9e6; --card:#ffffff; --card-h:#fbfbfa; --line:transparent; --line2:rgba(16,16,20,.12);
  --t1:#141418; --t2:#5c5c66; --t3:#94949c; --ink:#141418; --onink:#ffffff; --shadow:0 1px 2px rgba(16,16,20,.06),0 4px 14px rgba(16,16,20,.05);
  --ya:#d2541b; --ya-s:rgba(210,84,27,.10); --antes:#2f5fd0; --antes-s:rgba(47,95,208,.09);
  --desp:#62646e; --desp-s:rgba(98,100,110,.10); --no:#c2293a; --no-s:rgba(194,41,58,.08); --sin:#94949c; --sin-s:rgba(16,16,20,.04);
  --plat:#8b7e5f;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t1);font:15px/1.5 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}

.app{height:100%;display:flex;flex-direction:column}
.status{font-size:13.5px;color:var(--t1);background:var(--ya-s);padding:9px 12px;border-radius:10px;max-width:760px}
.status[hidden]{display:none}
.tech{border-top:1px solid var(--line2);padding-top:12px}
.tech summary{cursor:pointer;color:var(--t2);font-weight:700;font-size:13.5px;list-style:none;min-height:36px;display:flex;align-items:center}
.tech summary::-webkit-details-marker{display:none}
.tech summary::after{content:"⌄";margin-left:8px;transition:transform .2s ease}
.tech[open] summary::after{transform:rotate(180deg)}
.tech .tbody{display:flex;flex-direction:column;gap:10px;padding-top:6px;font-size:13.5px;color:var(--t2)}
.tech .tbody b{color:var(--t1);font-weight:600}
/* barra del lab: no es parte del diseño */
.labbar{flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:#000;color:#fff;font-size:13px}
.labbar b{font-family:var(--display);font-weight:700;margin-right:4px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;color:rgba(255,255,255,.65);font-weight:600}
.seg button.on{background:#fff;color:#000}
.labbar .hint{color:rgba(255,255,255,.5);margin-left:auto}

/* cabecera del producto */
.head{flex:0 0 auto;padding:16px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line2)}
.head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.head p{margin:2px 0 0;color:var(--t2);font-size:14px}
.kpis{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.kpi{display:flex;flex-direction:column;align-items:flex-end}
.kpi b{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.kpi span{color:var(--t3);font-size:12.5px}
.mods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.mods::-webkit-scrollbar{display:none}
.mod-chip{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--t2);font-weight:600;font-size:13.5px;white-space:nowrap;min-height:34px}
.mod-chip.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.mod-chip span{font-variant-numeric:tabular-nums;opacity:.6;margin-left:5px}

.stage{flex:1 1 auto;min-height:0;position:relative;display:flex}
.rail{flex:0 0 212px;border-right:1px solid var(--line2);overflow-y:auto;padding:12px 10px 24px max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:2px}
.rail[hidden]{display:none}
.rail button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px 8px;text-align:left;padding:9px 10px;border-radius:10px;min-height:44px;color:var(--t2)}
.rail button:hover{background:var(--sin-s)}
.rail button.on{background:var(--ink);color:var(--onink)}
.rail button b{font-weight:600;font-size:14px;line-height:1.25}
.rail button span{font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.7}
.rail button i{grid-column:1/-1;height:3px;border-radius:99px;background:var(--sin-s);overflow:hidden;display:flex}
.rail button i em{display:block;height:100%;background:currentColor;opacity:.55}
.rail .rsep{height:1px;background:var(--line2);margin:8px 6px}
.modbtn{display:none;align-self:flex-start;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);font-weight:700;font-size:14px;min-height:40px}
.mods.wrap{flex-wrap:wrap;overflow:visible}
.tools2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools2 .lab2{color:var(--t3);font-size:13px;font-weight:600}
.tseg{display:flex;background:var(--sin-s);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.tseg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2);min-height:34px}
.tseg button.on{background:var(--card);color:var(--t1);box-shadow:var(--shadow)}
:root:not([data-theme="lux"]) .tseg button.on{background:var(--ink);color:var(--onink)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--bg);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;max-height:75%;overflow-y:auto;padding:14px 16px max(20px,env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.sheet h3{font-size:16px;font-weight:800;margin:4px 4px 10px}
.sheet[hidden]{display:none}
.lsec{display:flex;flex-direction:column;gap:4px}
.lsec small{color:var(--t3);font-size:12.5px;font-weight:700}
.lsec div{font-size:15px;line-height:1.55;color:var(--t1)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--ya-s);color:var(--t1);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin:2px 0 8px;max-width:760px;position:sticky;left:0}
.alert b{color:var(--ya);font-weight:700;white-space:nowrap}
.pill.blk{background:var(--ya-s);color:var(--ya)}
.deps{display:flex;flex-direction:column;gap:6px}
.deps button{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);font-size:14px;font-weight:600;min-height:44px}
.view{flex:1 1 auto;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* tarjeta comun */
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r-s);padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.card:hover{background:var(--card-h)}
.card.sel{border-color:var(--ink)}
.card .ct{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.35;color:var(--t1);overflow-wrap:anywhere}
.card .cd{color:var(--t2);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .cm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;font-weight:600;color:var(--t3)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.srv{background:var(--no-s);color:var(--no)} .pill.loc{background:var(--sin-s);color:var(--t2)} .pill.mix{background:var(--antes-s);color:var(--antes)} .pill.par{background:var(--ya-s);color:var(--ya)}
.pill.sug{background:transparent;color:var(--t3);border:1px dashed var(--line2)}
.pill.nota{background:var(--sin-s);color:var(--plat)}
.sortable-ghost{opacity:.35}
.sortable-chosen{transform:scale(1.02)}
.sortable-drag{box-shadow:0 12px 30px rgba(0,0,0,.35)!important}

/* ---------- A: tablero por prioridad ---------- */
.A{display:flex;gap:12px;padding:14px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));min-height:100%;align-items:flex-start;scroll-snap-type:x proximity}
.A .colm{flex:1 1 200px;min-width:200px;max-width:340px;background:var(--col);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100% - 4px);scroll-snap-align:start}
.colh{padding:12px 14px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0}
.colh-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.colh h2{font-size:15px;font-weight:700}
.colh .n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding:1px 9px;border-radius:99px}
.colh p{margin:0;color:var(--t3);font-size:12.5px;line-height:1.35}
.colb{flex:1 1 auto;overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.grp{font-size:12.5px;font-weight:700;color:var(--t2);padding:10px 2px 0}
.n.ya{background:var(--ya-s);color:var(--ya)} .n.antes{background:var(--antes-s);color:var(--antes)} .n.despues{background:var(--desp-s);color:var(--desp)} .n.descartar{background:var(--no-s);color:var(--no)} .n.sin{background:var(--sin-s);color:var(--t2)}
.empty-drop{border:1.5px dashed var(--line2);border-radius:var(--r-s);padding:18px 10px;text-align:center;color:var(--t3);font-size:13px}

/* ---------- B: tabla por modulo ---------- */
.B{padding:8px max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left));max-width:1100px}
.bgroup{margin-top:18px}
.bgh{display:flex;align-items:center;gap:12px;padding:8px 4px;width:100%;text-align:left;min-height:44px}
.bgh h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.bgh .cnt{color:var(--t3);font-size:13px;font-variant-numeric:tabular-nums}
.bgh .chev{margin-left:auto;color:var(--t3);font-size:16px;transition:transform .2s ease}
.bgroup.closed .chev{transform:rotate(-90deg)}
.bgroup.closed .brows{display:none}
.dist{display:flex;height:6px;border-radius:99px;overflow:hidden;width:120px;background:var(--sin-s)}
.dist i{display:block}
.brows{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.brow{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 130px;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2);min-height:52px;background:var(--card)}
.brow:first-child{border-top:0}
.brow .hd{color:var(--t3);cursor:grab;font-size:16px;text-align:center;touch-action:none;padding:6px 0}
.brow .bt{min-width:0;cursor:pointer}
.brow .bt b{display:block;font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.brow .bt span{display:block;color:var(--t3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppick{justify-self:start;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;min-height:34px;white-space:nowrap}
.ppick.ya{background:var(--ya-s);color:var(--ya)} .ppick.antes{background:var(--antes-s);color:var(--antes)} .ppick.despues{background:var(--desp-s);color:var(--desp)} .ppick.descartar{background:var(--no-s);color:var(--no)} .ppick.sin{background:var(--sin-s);color:var(--t2);border:1px dashed var(--line2)}
.brow .tg{justify-self:end}
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.3);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:190px}
.menu button{text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;min-height:42px}
.menu button:hover{background:var(--sin-s)}

/* ---------- C: filas por modulo x columnas por prioridad ---------- */
.C{padding:0 max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left));min-width:900px}
.C .chead{position:sticky;top:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 0 8px}
.C .chead div{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.C .chead h2{font-size:14px;font-weight:700}
.lane{margin-top:10px}
.laneh{display:flex;align-items:center;gap:10px;padding:8px 2px;position:sticky;left:0;min-height:44px}
.laneh h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.laneh .cnt{color:var(--t3);font-size:13px}
.laneh .chev{color:var(--t3);transition:transform .2s ease}
.lane.closed .chev{transform:rotate(-90deg)}
.lane.closed .cells{display:none}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.chead .n{font-family:var(--display);font-weight:700;font-size:13px;padding:1px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.cell{background:var(--col);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:64px}

/* panel de detalle: lateral en pantallas anchas, hoja inferior en celular */
.detail{flex:0 0 400px;border-left:1px solid var(--line2);background:var(--bg);overflow-y:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:16px}
.detail[hidden]{display:none}
.dx{align-self:flex-end;font-size:14px;font-weight:600;color:var(--t2);padding:8px 12px;border-radius:99px;border:1px solid var(--line2);min-height:38px}
.dmod{font-size:13px;font-weight:700;color:var(--plat)}
.detail h2{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.ddesc{color:var(--t2);font-size:15px;line-height:1.6}
.dk{display:flex;flex-direction:column;gap:6px}
.dk small{color:var(--t3);font-size:12.5px;font-weight:600}
.dk div{font-size:14px;overflow-wrap:anywhere}
.dprio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dprio button{padding:11px 10px;border-radius:12px;border:1px solid var(--line2);font-weight:700;font-family:var(--display);font-size:14px;min-height:46px;color:var(--t2)}
.dprio button.on.ya{background:var(--ya-s);border-color:var(--ya);color:var(--ya)}
.dprio button.on.antes{background:var(--antes-s);border-color:var(--antes);color:var(--antes)}
.dprio button.on.despues{background:var(--desp-s);border-color:var(--desp);color:var(--t1)}
.dprio button.on.descartar{background:var(--no-s);border-color:var(--no);color:var(--no)}
.dnote{width:100%;min-height:110px;font:inherit;font-size:16px;color:var(--t1);background:var(--col);border:1px solid var(--line2);border-radius:12px;padding:12px;resize:vertical}

@media (max-width:899px){
  .rail{display:none!important}
  .modbtn.c1{display:inline-flex}
  .detail{position:fixed;inset:auto 0 0 0;max-height:82%;border-left:0;border-top:1px solid var(--line2);border-radius:20px 20px 0 0;z-index:40;box-shadow:0 -20px 50px rgba(0,0,0,.35);padding-bottom:max(28px,env(safe-area-inset-bottom))}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .brow{grid-template-columns:24px minmax(0,1fr) auto}
  .brow .tg{display:none}
  .kpis{display:none}
}
@media (max-width:600px){
  .C{min-width:0}
  .C .chead{display:none}
  .cells{grid-template-columns:1fr}
  .cell::before{content:attr(data-label);font-family:var(--display);font-weight:700;font-size:13px;color:var(--t2);padding:2px 4px}
  .cell{min-height:44px}
  .alert{flex-wrap:wrap;position:static}
  .A{flex-direction:column;scroll-snap-type:none}
  .A .colm{flex:none;max-width:none;width:100%;max-height:none}
  .A .colb{overflow:visible}
  .A.tabsmode .colm{display:none} .A.tabsmode .colm.cur{display:flex}
  .atabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
  .brow .bt span{display:none}
  .head h1{font-size:21px}
}
@media (min-width:601px){ .atabs{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} .sortable-chosen{transform:none} }
.scrim[hidden]{display:none}
</style>
<div class="app">
  <header class="head">
    <div class="head-top">
      <div><h1>Pendientes EventOS</h1><p id="sub"></p></div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="status" id="status" hidden></div>
    <div class="mods" id="mods"></div>
    <button class="modbtn" id="modbtn"></button>
    <div class="tools2"><span class="lab2">Mostrar</span><div class="tseg" id="segBlk"></div><span class="lab2">Ordenar módulos</span><div class="tseg" id="segOrd"></div></div>
  </header>
  <div class="atabs" id="atabs"></div>
  <div class="stage">
    <aside class="rail" id="rail" hidden></aside>
    <div class="view" id="view"></div>
    <div class="scrim" id="scrim" hidden></div>
    <aside class="detail" id="detail" hidden></aside>
    <div class="sheet" id="sheet" hidden></div>

C 2026 — lo que sale de la referencia (Kamilo 2026-10-14) — 0/6", "titulo": "B.6 Respaldo de chat para eventos grandes", "desc": "Evaluar Ably (o similar) solo si la medición de 5.000 muestra que nuestro socket no aguanta. Decisión por evento, no reescritura.", "fuentes": [], "etiqueta": null, "parcial": false, "cuando": "antes", "mod": "streaming", "dep": []}, {"id": "86c4e9a3c942", "sec": 5, "secT": "Webapp", "sub": "BLOQUE 8 — W.19 Spatial Player (visionOS): el stream convive con el resto — 0/9 (abierto 2026-09-07)", "titulo": "8.1 Player persistente a nivel shell", "desc": "Sacar StreamPlayer de la ruta y montarlo en un StreamProvider del shell W.0 (junto a GlobalSocketProvider) con estado {sessionId, mode: 'full' | 'split' | 'mini' | 'closed'}. La ruta session-stream/[id] pasa a ser solo el layout full; navegar NO desmonta el iframe (YouTube/Vimeo/HLS). Ref: StreamShell.tsx (grid por página), detectSource.ts.", "fuentes": ["StreamShell.tsx", "detectSource.ts"], "etiqueta": null, "parcial": false, "cuando": "antes", "mod": "streaming", "dep": []}, {"id": "04f87f1d2d6c", "sec": 5, "secT": "Webapp", "sub": "BLOQUE 8 — W.19 Spatial Player (visionOS): el stream convive con el resto — 0/9 (abierto 2026-09-07)", "titulo": "8.2 Modo split con Agenda", "desc": "Click en Agenda desde el stream → mode: 'split': player izq (16:9 con controles) + agenda der en el mismo canvas. Clic en otra sesión con stream → cambia la fuente sin salir. Sin stream → DetailPanel normal. Ref: agenda/DetailPanel.tsx, patron split feedback_split_layout_pattern.", "fuentes": ["agenda/DetailPanel.tsx"], "etiqueta": null, "parcial": false, "cuando": "antes", "mod": "streaming", "dep": []}, {"id": "61268d1303e7", "sec": 5, "secT": "Webapp", "sub": "BLOQUE 8 — W.19 Spatial Player (visionOS): el stream convive con el resto — 0/9 (abierto 2026-09-07)", "titulo": "8.3 Modo mini (flotante) para el resto", "desc": "Cualquier otra ruta → mode: 'mini': card 320px esquina inferior derecha (fuera del Sidebar 12, "t": "DIFERIDO A FASE 2 Y NICE TO HAVE (no antes del 6 de diciembre salvo que un cliente lo pida)", "intro": ""}, {"n": 13, "t": "DESPUES DEL 6 DE DICIEMBRE — infraestructura (ROADMAP-INFRAESTRUCTURA.md:260)", "intro": ""}], "modulos": [{"k": "servidor", "t": "Servidor y capacidad", "n": 40}, {"k": "torre", "t": "Torre de control", "n": 7}, {"k": "registro", "t": "Registro, landing y correo", "n": 15}, {"k": "agenda", "t": "Agenda", "n": 10}, {"k": "streaming", "t": "Streaming y chat", "n": 16}, {"k": "social", "t": "Social y networking", "n": 10}, {"k": "juegos", "t": "Juegos y gamificación", "n": 5}, {"k": "admin", "t": "Admin y organizador", "n": 12}, {"k": "app", "t": "App Expo", "n": 17}, {"k": "seguridad", "t": "Seguridad", "n": 4}, {"k": "calidad", "t": "Calidad de la webapp", "n": 24}, {"k": "qa", "t": "QA presencial", "n": 11}, {"k": "bugs", "t": "Bugs", "n": 9}, {"k": "decisiones", "t": "Decisiones tuyas", "n": 14}, {"k": "manual", "t": "Manual y documentación", "n": 4}, {"k": "fase3", "t": "Producto a futuro", "n": 17}], "moddep": {"torre": {"mod": "servidor", "texto": "Para ver datos reales hace falta el servidor de prueba arriba."}, "registro": {"mod": "servidor", "texto": "Abrir el registro al público exige el servidor de producción y el correo listo."}, "app": {"mod": "servidor", "texto": "Publicar en tiendas exige que la app apunte al servidor de producción."}, "qa": {"mod": "servidor", "texto": "Probar en teléfono con gente real necesita la webapp en el servidor de prueba."}, "seguridad": {"mod": "servidor", "texto": "El último chequeo de seguridad se corre contra el servidor real."}}, "simples": {"c1e8c66d35fc": {"titulo": "Que cada pantalla le pida menos cosas al servidor", "que": "Cada vez que alguien abre la agenda, su celular le hace unos 9 pedidos distintos al servidor: las sesiones, sus favoritas, los speakers, el evento. La idea es que la agenda llegue en un solo pedido, ya armada, y que el servidor no tenga que responder lo mismo mil veces: si 100 personas piden la agenda en el mismo minuto, responde una vez y repite. Lo que cambia en vivo llega solo, sin que nadie lo pida. Después se hace lo mismo con las demás pantallas.", "porque": "Con 5.000 personas abriendo la agenda al tiempo son 45.000 pedidos de golpe. Bajarlo a 1 por persona es lo que más alivia el servidor el 6 de diciembre.", "lista": "Cuando la agenda carga con un solo pedido y medimos que las demás pantallas bajaron de 9 a 3 o menos."}, "2d375ca3809c": {"titulo": "Darme acceso a DigitalOcean para montar el servidor", "que": "DigitalOcean es donde se alquilan los servidores. Para crear o prender máquinas necesito una llave de acceso, y la que había se anuló por seguridad. Tú la generas en su página y la escribes en la terminal con un comando; yo nunca la veo.", "porque": "Sin esa llave no se puede montar nada: es el primer paso de todo lo de servidor.", "lista": "Cuando el comando confirma que la cuenta quedó conectada."}, "34cb8b604f21": {"titulo": "Montar un servidor de prueba igual al de agosto", "que": "En agosto montamos un servidor que aguantó 300 personas y guardamos una copia (como una foto) de cada máquina. La idea es prenderlas otra vez desde esas fotos y subirles el código de hoy, para probar con algo real y no en el computador.", "porque": "En agosto aprendimos que lo que funciona en el computador falla en el servidor. Todo lo que se mida para diciembre se mide aquí.", "lista": "Cuando la webapp abre desde ese servidor y una persona puede entrar, ver la agenda y el streaming."}, "cfd7a98e6b91": {"titulo": "Que un auditorio entero pueda entrar a la vez desde el mismo wifi", "que": "En un evento, cientos de personas se conectan desde el mismo wifi, y para el servidor todas parecen ser una sola. Antes las bloqueaba por \"demasiados intentos\". Ya cambiamos el código para que solo cuente los intentos fallidos y deje pasar a la gente normal. Falta probarlo en el servidor real.", "porque": "Si esto falla, la gente se queda afuera justo al entrar al evento, que es el peor momento.", "lista": "Cuando simulamos 1.000 personas entrando desde la misma red y ninguna queda bloqueada."}, "70040ab22c2b": {"titulo": "Revisar un error de \"servicio no disponible\" que salió con una sola persona", "que": "En agosto, navegando solo, la webapp devolvió una vez un error de \"servicio no disponible\". Con una persona no debería pasar nunca. Hay que ver si sigue pasando y por qué.", "porque": "Si falla con una persona, con 5.000 va a fallar mucho más.", "lista": "Cuando sabemos la causa y lo corregimos, o comprobamos que ya no ocurre."}, "3582eb97a57a": {"titulo": "Torre de control: ver en vivo cómo va el evento por dentro", "que": "Una pantalla en el admin, solo para ti, que muestra en tiempo real cuánta gente está conectada, qué tan rápido responde la plataforma, si hay errores y qué máquina está cargada. Hoy eso solo se ve entrando a los servidores por consola.", "porque": "La idea es enterarnos de un problema antes de que un asistente se queje, y poder actuar a tiempo.", "lista": "Cuando la pantalla muestra datos reales del servidor de prueba y una falla provocada aparece en ella en segundos."}, "dd2750343a29": {"titulo": "El admin se puede quedar trabado 10 segundos si el tiempo real se cae", "que": "Cuando cambias algo de una sesión en el admin, el sistema avisa al tiempo real para que les llegue a todos. Si el tiempo real está caído, el admin se queda esperando hasta 10 segundos sin responder. Hay que ponerle un límite corto a esa espera.", "porque": "En pleno evento, un admin congelado es justo lo que no puede pasar.", "lista": "Cuando, con el tiempo real apagado, el admin guarda al instante y no se traba."}, "fb36bfffac12": {"titulo": "Las horas pueden salir corridas 5 horas en el celular", "que": "Algunas pantallas de la webapp en celular calculan la hora sin decir que es hora de Colombia. En el computador sale bien, pero los servidores usan otra zona horaria y la hora podría salir corrida 5 horas, o la pantalla parpadear al cargar.", "porque": "Una agenda con la hora equivocada confunde a todo el evento.", "lista": "Cuando las 7 pantallas fijan la hora de Bogotá y se ven bien en el servidor."}, "5f766119b572": {"titulo": "Cambiar la protección anti-robots de prueba por la real antes de abrir el registro", "que": "El registro tiene una protección de Cloudflare que frena robots. Hoy usa llaves de prueba que dejan pasar a cualquiera. Antes de abrir el registro al público hay que poner las llaves reales.", "porque": "Sin esto, un robot podría llenar el registro con miles de inscripciones falsas.", "lista": "Cuando las llaves reales están puestas y una inscripción normal pasa sin problema."}, "00c34bd2cd38": {"titulo": "Limitar los intentos en olvidé mi contraseña y registro", "que": "Algunas puertas de la cuenta (olvidé mi contraseña, registro, activación) no tienen límite de intentos. Alguien podría usarlas miles de veces para mandar correos basura o adivinar datos.", "porque": "Además del riesgo, cada correo cuesta y podría gastar el cupo de envíos el día del evento.", "lista": "Cuando cada una de esas puertas tiene un límite razonable y hay una prueba que lo confirma."}, "2a70c0fdd387": {"titulo": "Que todo el texto se lea bien, también para quien ve menos", "que": "Revisar que los textos y botones tengan suficiente contraste con el fondo, en oscuro y en claro, según el estándar que usan las empresas grandes.", "porque": "Los clientes corporativos lo piden, y además se lee mejor en una pantalla con sol o con poco brillo.", "lista": "Cuando la revisión automática no marca ningún texto con contraste bajo."}, "617dda9f4828": {"titulo": "Guardar el trabajo del resumen del evento que quedó a medias en la app", "que": "En la app quedó trabajo del resumen del evento (el estilo \"Wrapped\") sin guardar en el historial, porque tiene 4 errores que no dejan compilar. Hay que corregirlos y guardarlo.", "porque": "Mientras esté ahí suelto, cualquier cambio en la app corre el riesgo de pisarlo o perderlo.", "lista": "Cuando la app compila sin errores y ese trabajo queda guardado."}, "5be11b553602": {"titulo": "Medir cuánto usa la app una persona real", "que": "Contar, por persona y por minuto, cuántas pantallas abre y qué hace. Con eso sabemos cuánta carga genera de verdad un asistente, y no un cálculo a ojo.", "porque": "Ese número decide qué tamaño de servidor contratar para 5.000 personas y cuánto cuesta.", "lista": "Cuando tenemos el promedio real de un evento o una prueba con gente."}, "8e65866b0a56": {"titulo": "Juegos cortos que la gente juega cuando quiera escaneando un QR", "que": "Hoy los juegos son en vivo: los lanza el presentador. La idea es sumar juegos que la persona juega cuando quiere, escaneando un QR en un stand: una trivia, memoria, ahorcado. Suma al mismo ranking. Si se cae el internet, retoma donde iba.", "porque": "Es lo que Bintec tuvo con Bintec Play y a nosotros nos falta. Llena los tiempos muertos y le da vida a los stands de los patrocinadores.", "lista": "Cuando hay un diseño aprobado en lab y al menos un juego funciona de punta a punta desde un QR."}, "9d833236b25a": {"titulo": "Separar la agenda de todos de la tuya", "que": "Hoy la agenda se arma persona por persona, aunque el 95 % es igual para todos. La idea es que la parte común (sesiones, salas, horas) se arme una vez y se reparta a todos, y que solo tus favoritas se pidan aparte.", "porque": "Es una de las pantallas más abiertas del evento. Si se arma una vez en vez de 5.000, el servidor respira.", "lista": "Cuando medimos en el servidor que la agenda aguanta la carga de 5.000 sin subir el tiempo de respuesta."}, "2cc01d6b118e": {"titulo": "Revisar qué copias de servidor tenemos guardadas y cuánto cuestan", "que": "En agosto quedaron guardadas copias (como fotos) de las máquinas y de las bases de datos que DigitalOcean mantiene por nosotros. Hay que listar cuáles siguen existiendo y cuánto cuesta por día prenderlas. No se prende nada sin que tú lo confirmes.", "porque": "Es el primer paso para montar el servidor de prueba sin sorpresas en la factura.", "lista": "Cuando tienes la lista de lo que existe con su costo por día y apruebas qué se prende."}, "6b5e2cecf0e1": {"titulo": "Medir cómo está el servidor hoy, antes de arreglar nada", "que": "Ya tenemos una prueba que simula gente entrando al evento: pide su acceso, entra, ve la agenda. La idea es correrla en el servidor de prueba tal como está hoy y anotar los números. Así después sabemos cuánto mejoró cada arreglo.", "porque": "Sin un punto de partida no podemos demostrar que algo mejoró ni decidir qué arreglar primero para el 6 de diciembre.", "lista": "Cuando la prueba corrió en el servidor de prueba y los números quedaron anotados."}, "23294f123ccb": {"titulo": "Probar en el servidor los arreglos del correo y de la entrada", "que": "El 12 de octubre quedaron hechos en código dos arreglos: que los correos salgan a un ritmo controlado sin chocar con el límite de Resend, y que la entrada no bloquee a un auditorio conectado al mismo wifi. Funcionan en el computador; falta medirlos en el servidor real.", "porque": "Son los dos problemas que pueden dejar gente afuera del evento.", "lista": "Cuando en el servidor una ola de gente entra y recibe su correo sin bloqueos ni correos perdidos."}, "9d4092240b97": {"titulo": "Cerrar la verificación en dos pasos del equipo con la revisión final", "que": "El equipo que entra al admin ya tiene verificación en dos pasos: la contraseña más un código del celular. Van 25 de 26 partes hechas. Falta la última: correr una revisión automática de seguridad con la configuración real del servidor, que confirma, por ejemplo, que todo viaje cifrado y que haya un administrador principal que pueda entrar.", "porque": "Protege el admin, donde están los datos de los 5.000 asistentes. Se hace al montar el servidor.", "lista": "Cuando la revisión corre en el servidor real y no marca ningún problema."}, "0a31a53ec3ad": {"titulo": "Que cada versión salga empacada y lista para instalar", "que": "Hoy el código se copia a cada máquina desde una máquina base. La idea es que GitHub, donde está guardado el código, arme solo un paquete por cada versión: uno para el backend, otro para la webapp y otro para el tiempo real. Cada máquina descarga el suyo.", "porque": "Así todas las máquinas tienen exactamente lo mismo y montar el servidor no depende de copiar a mano, que es donde salen los errores.", "lista": "Cuando una versión nueva genera sus paquetes sola y una máquina se instala con ellos."}, "4907d2e3273f": {"titulo": "Escribir la receta para montar cada tamaño de servidor", "que": "Tenemos un catálogo de tamaños de servidor, del nivel 0 (una sola máquina, para demos) al nivel 4 (el más grande). Terraform es una herramienta donde se escribe, como una receta, qué máquinas lleva cada tamaño en DigitalOcean y Cloudflare. Con la receta se ve el costo antes de prender y se apaga todo sin dejar nada cobrando. Esta tarea es escribirla; usarla ya se hace en el servidor.", "porque": "Para el 6 de diciembre hay que montar el tamaño grande sin errores, y para vender hay que poder montar uno por cliente.", "lista": "Cuando la receta de los niveles 0 a 4 está escrita y muestra el costo de cada uno antes de prender."}, "32bd1f743b1c": {"titulo": "Montar el servidor paso a paso, con una revisión entre cada paso", "que": "Un proceso automático que monta todo en orden: primero el plan (cliente, dominio, tamaño y fechas, que tú apruebas), luego revisar que esté todo lo necesario, después las bases de datos, las máquinas y lo demás, hasta el paso 6. Entre un paso y otro hay una revisión: si algo no está bien, se detiene ahí en vez de seguir con el error.", "porque": "Es lo que permite montar el servidor del evento sin tocar nada a mano, y repetirlo para cada cliente.", "lista": "Cuando el nivel 1 se monta de cero solo con este proceso y cada revisión pasa en verde."}, "27f55fb71022": {"titulo": "Prueba automática de que todo funciona después de montar", "que": "Al terminar de montar, un programa actúa como una persona real: abre la página del evento, pide su enlace de acceso y confirma que el correo le llegó, entra, ve la agenda, se conecta al tiempo real y sube una foto. Si algo falla, avisa.", "porque": "Así sabemos que el servidor sirve de verdad antes de que entre el primer asistente.", "lista": "Cuando la prueba corre sola después de cada montaje y sale en verde, incluido el correo recibido."}, "cb28953a35ac": {"titulo": "Montar el servidor desde cero y desmontarlo sin dejar nada cobrando", "que": "Comprobar que el servidor de prueba (nivel 1) se puede montar desde cero solo con el proceso automático, sin las copias de agosto ni nada hecho a mano, y después borrarlo completo. Para eso se usan llaves de acceso nuevas de DigitalOcean y Cloudflare.", "porque": "Si solo sabemos montar desde copias viejas, el día que una falle no tenemos cómo reponerla. Y lo que queda prendido sin uso se cobra.", "lista": "Cuando el nivel 1 se monta de cero, pasa la prueba automática y se borra sin que quede nada en la factura."}, "94e883d59162": {"titulo": "Comprobar en el servidor que los correos salen todos y a buen ritmo", "que": "Resend, el servicio que manda los correos, solo deja enviar cierta cantidad por segundo. Ya cambiamos el código para que los correos salgan en fila a un ritmo seguro, que los enlaces de acceso pasen primero y que, si uno falla, se reintente hasta por 12 horas. Falta el plan pagado de Resend, pedirles más envíos por segundo y medirlo en el servidor.", "porque": "Si 5.000 personas piden su enlace a la vez y los correos se traban, se quedan afuera del evento.", "lista": "Cuando en el servidor una ola real de pedidos entrega todos los correos sin chocar con el límite."}, "10aa91e9f590": {"titulo": "Que los juegos en vivo aguanten con 5.000 personas conectadas", "que": "Cuando el presentador lanza un juego, el sistema avisa a todas las pantallas de cada cambio y, cada vez, vuelve a calcular quiénes pueden participar. La idea es limitar cuántos avisos se mandan y guardar esa lista de participantes para no recalcularla a cada rato (caché: guardar una respuesta para repetirla).", "porque": "Los juegos son el momento en que todos tocan la pantalla al mismo tiempo; si se traban, se nota en pleno evento.", "lista": "Cuando hay pruebas del cambio y en el servidor un juego corre con mucha gente sin que la app se ponga lenta."}, "1a917ba767ea": {"titulo": "Que los reportes lean de una copia y no carguen la base principal", "que": "Una réplica es una copia de la base de datos que se mantiene al día sola y sirve para leer sin cargar la principal. La idea es que el Data Center, el panel de rendimiento (Pulse) y las descargas de datos lean de esa copia. Así la base principal queda libre para los asistentes.", "porque": "Si alguien baja un reporte grande en pleno evento, no debería poner lenta la app de 5.000 personas.", "lista": "Cuando esas tres partes leen de la copia y medimos que un reporte grande no frena la app."}, "6764ff3fa2c4": {"titulo": "Darle al admin su propia máquina, aparte de los asistentes", "que": "Hoy el admin y la app de los asistentes pueden quedar en las mismas máquinas. La idea es que el montaje ponga el admin en su propia dirección (admin.tudominio) y en una máquina por donde no pasa el tráfico de los asistentes.", "porque": "Así, por mucha gente que haya, tú y tu equipo pueden trabajar en el admin sin que se ponga lento.", "lista": "Cuando el admin abre desde su dirección propia y, con carga de asistentes encima, sigue respondiendo rápido."}, "d6e50dbec15c": {"titulo": "Que la pantalla Social pida menos cosas al abrirla", "que": "Al abrir Social, la webapp le hace 10 pedidos al servidor: muro, sugeridos, solicitudes, contactos, directorio, historias, fotos, concurso y más. Casi todo es personal, así que guardar una respuesta para repetirla no ayuda. La idea es cargar cada pestaña solo cuando la abres, o juntar todo en un solo pedido.", "porque": "Es la segunda pantalla más visitada. Bajar esos 10 pedidos alivia mucho al servidor con 5.000 personas.", "lista": "Cuando medimos antes y después y Social pide bastante menos al abrir."}, "62f25856337a": {"titulo": "Que te llegue una alerta al teléfono si algo deja de responder", "que": "Un servicio externo, como BetterStack o UptimeRobot, revisa cada poco tiempo y desde afuera que el servidor, la app y el tiempo real respondan. Si algo no contesta, te avisa al teléfono.", "porque": "El día del evento tienes que enterarte de una caída en segundos, no cuando los asistentes se quejen.", "lista": "Cuando apagamos algo a propósito y suena tu teléfono."}, "9bf55ad37b08": {"titulo": "Copia de seguridad automática fuera de DigitalOcean, y probada", "que": "Programar que la base de datos se copie sola cada cierto tiempo, con candado (cifrada), en R2, el almacenamiento de Cloudflare, o sea fuera de DigitalOcean. Y lo más importante: probar que de esa copia se puede recuperar todo, no solo que la copia exista.", "porque": "Si algo le pasa a la base o a DigitalOcean, sin una copia que sirva se pierden los datos del evento y de los asistentes.", "lista": "Cuando una copia se restaura entera en una base nueva y los datos están completos."}, "86c3ec9e1983": {"titulo": "Poder rastrear qué le pasó a una persona a una hora exacta", "que": "Hoy cada máquina anota por su lado lo que pasa. La idea es juntar todas esas anotaciones en un solo lugar y marcar cada pedido con un número único, para poder responder preguntas como \"qué le pasó a la persona 1320 a las 10:42\".", "porque": "Si un asistente reporta un problema durante el evento, se encuentra la causa en minutos en vez de adivinar.", "lista": "Cuando, con un pedido cualquiera, encontramos todo su recorrido en un solo lugar."}, "18ddedec6e81": {"titulo": "Alertas cuando algo se sale de lo normal", "que": "Con lo que ya medimos sabemos qué es normal: qué tan rápido responde la plataforma y cuánta carga aguanta. La idea es que suene una alerta cuando algo pase esos límites. En especial, si a una persona normal la frena el aviso de \"demasiados intentos\", tiene que sonar siempre.", "porque": "Avisa antes de que el problema crezca y nos dice al instante si estamos dejando gente afuera.", "lista": "Cuando forzamos que se pase un límite y llega la alerta."}, "e656151fba38": {"titulo": "Sumar una máquina más con un solo comando", "que": "Si en pleno evento una parte se carga, hoy sumar otra máquina sería trabajo a mano. La idea es un comando que agregue una máquina más, por ejemplo a la API (la parte que responde los pedidos de la app), desde el proceso automático de montaje.", "porque": "Si el 6 de diciembre llega más gente de la esperada, se agrega capacidad en minutos.", "lista": "Cuando un comando suma una máquina, esta entra a trabajar sola y nadie nota errores mientras tanto."}, "50c468aa9a3f": {"titulo": "Poder simular 5.000 personas a la vez", "que": "Para probar con 5.000 hay que simular 5.000 asistentes. Un solo computador no alcanza, así que la prueba tiene que correr desde varias máquinas a la vez, y hay que crear miles de asistentes de prueba con su propio acceso (hoy hay solo 4).", "porque": "Sin esto no podemos saber si el servidor aguanta el evento del 6 de diciembre.", "lista": "Cuando la prueba lanza miles de asistentes desde varias máquinas y cada uno entra con su propio acceso."}, "b5ace2c87eb6": {"titulo": "Montar el servidor grande y medirlo hasta 5.000 personas", "que": "Montar el nivel 3 y someterlo a todo lo que puede pasar ese día: todos entrando a la vez, gente con datos 4G de Colombia, el admin trabajando con carga encima, descargas de reportes, juegos en vivo y una foto viral con muchas subidas al tiempo (hay un límite de 10 por minuto). Además, una persona de prueba aparte sirve de termómetro de cómo se siente la app.", "porque": "Esto es lo que dice si el servidor aguanta el 6 de diciembre o hay que pasar al tamaño siguiente.", "lista": "Cuando la persona número 5.001 navega igual que la primera y no hay errores."}, "99ccf6e8fddd": {"titulo": "Apagar máquinas a propósito con mucha gente adentro", "que": "Con la carga encima, apagar a propósito una máquina de cada tipo (la de la app, la del tiempo real y las demás) y ver si los asistentes lo notan. También repetir el apagón de la API, ahora con la máquina más grande, de 4 procesadores.", "porque": "En el evento una máquina se puede caer en cualquier momento; lo que importa es que la gente no se entere.", "lista": "Cuando cada apagón pasa sin errores para los asistentes."}, "a4197b0f2668": {"titulo": "Elegir el tamaño de servidor y escribir qué se le promete al cliente", "que": "Con las mediciones, decidir entre el nivel 3 y el nivel 4 y dejar por escrito la promesa: cuánta gente aguanta, cuánto cuesta al mes, cuánto tarda en volver si algo se cae y cuántos datos se podrían perder como máximo (eso es lo que miden el RTO y el RPO).", "porque": "Es lo que se le cotiza al cliente y lo que fija el costo del evento del 6 de diciembre.", "lista": "Cuando está escrita la promesa del nivel elegido con su costo mensual cerrado."}, "28028c79d6cd": {"titulo": "Que el montaje automático pruebe la carga y entregue un informe", "que": "Completar el proceso automático con sus últimos pasos: meterle carga de gente unos minutos, apagar una máquina de cada tipo para ver que nada se cae y, al final, entregar: la alerta externa conectada, una copia inicial, el acceso al asistente de configuración del evento, las claves por un canal seguro y un informe con lo verificado, los tiempos y el costo.", "porque": "Así cada montaje, el del 6 de diciembre o el de cualquier cliente, llega probado y con la prueba por escrito.", "lista": "Cuando un montaje completo termina solo y genera su informe con todo en verde."}, "d80a263bc238": {"titulo": "Pagar poco mientras la gente se registra y crecer para el evento", "que": "Durante las semanas de registro entra poca gente, así que basta un servidor pequeño. La idea es un comando que cambie entre \"modo registro\" (barato) y \"modo evento\" (el tamaño completo, que se prende la víspera).", "porque": "Ahorra plata en las semanas antes del 6 de diciembre sin arriesgar el día del evento.", "lista": "Cuando el comando pasa de un modo al otro y la plataforma sigue funcionando durante el cambio."}, "0dbb663e0468": {"titulo": "Guía del día del evento: si pasa esto, haz esto", "que": "Un documento con la respuesta lista para cada problema posible el día del evento. Incluye el protocolo que ya está escrito para caídas y un \"modo evento en curso\" que congela los cambios a la plataforma y saca una copia de seguridad al empezar. Hoy hay un borrador.", "porque": "En pleno evento no hay tiempo para pensar; tener cada respuesta escrita evita errores bajo presión.", "lista": "Cuando la guía cubre los problemas que probamos en los ensayos y la revisamos juntos."}, "d1b37799990b": {"titulo": "Ensayo general una semana antes del evento", "que": "El 28 y 29 de noviembre se monta el servidor elegido con el proceso automático, se le mete la carga real y se apaga una máquina con gente adentro. Si nadie lo nota, estamos listos para el evento. Después se desmonta.", "porque": "Es la prueba final de que el 6 de diciembre va a funcionar.", "lista": "Cuando el ensayo sale en verde de punta a punta y nadie nota el apagón."}, "59aca7da87d3": {"titulo": "Que cada cliente mande los correos desde su propio dominio", "que": "Los correos de acceso salen por Resend. Para cada cliente hace falta su llave de Resend, verificar su dominio para que el correo salga a su nombre, y pasar la prueba de Mail-Tester, que califica si un correo cae en spam, con más de 9 sobre 10.", "porque": "Si el correo de acceso cae en spam, la persona no puede entrar al evento.", "lista": "Cuando Mail-Tester da más de 9 sobre 10 con el dominio del cliente."}, "fd00e546322b": {"titulo": "Cancelar o usar el repartidor de Cloudflare que cobra sin uso", "que": "En Cloudflare está contratado un balanceador, que es lo que reparte a la gente entre varias máquinas. Cobra 5 dólares al mes y hoy no tiene nada detrás; lo encontramos el 13 de septiembre. Hay que decidir si se cancela o se usa en el montaje.", "porque": "Es plata que se va cada mes sin dar nada a cambio.", "lista": "Cuando está cancelado o conectado a las máquinas reales."}, "bd8cff5113f6": {"titulo": "Evitar la estampida cuando 5.000 entran después de un rato quietos", "que": "Para no revisar el acceso de cada persona a cada momento, el servidor recuerda por un rato quién ya entró (caché). Si pasan 15 minutos sin uso, lo olvida, y si los 5.000 llegan de golpe hay que revisarlos a todos al tiempo. En una prueba así se perdieron 832 de 1.500 conexiones. La idea es precalentar: llenar ese recuerdo antes de que llegue la gente.", "porque": "Es justo lo que pasa al abrir las puertas del evento: mucha gente a la vez después de un rato de calma.", "lista": "Cuando repetimos la llegada en ola después de 15 minutos quietos y no se pierde ninguna conexión."}, "ea3230cdafd8": {"titulo": "Activar Sentry para ver los errores de la plataforma real", "que": "Sentry es un servicio que recoge los errores que les salen a los usuarios y nos avisa. Hay que conectarlo a la plataforma real con su llave de producción y comprobar que de verdad recibe los errores.", "porque": "Si a un asistente le falla algo el día del evento, lo vemos aunque no lo reporte.", "lista": "Cuando provocamos un error de prueba en la plataforma real y aparece en Sentry."}, "76bd9dd0dd61": {"titulo": "Que los avisos en vivo no hagan fila en los momentos pico", "que": "Cuando pasa algo, por ejemplo una pregunta de trivia, el backend avisa al tiempo real por unas pocas líneas abiertas, hoy 6. Con muchos avisos por segundo esas líneas se llenan y los avisos esperan en fila. La idea es abrir más líneas y acortar las esperas.", "porque": "En un pico de trivia con mucha gente, un aviso que llega tarde se nota en todas las pantallas.", "lista": "Cuando una prueba con muchos avisos por segundo los entrega sin que se forme fila."}, "a9d9b9f68bfa": {"titulo": "Avisarle al admin cuando pase algo raro", "que": "Que el sistema detecte por sí solo comportamientos fuera de lo normal en la plataforma y le avise al admin, sin que nadie tenga que estar mirando.", "porque": "Es para después del evento: suma seguridad, pero no bloquea el 6 de diciembre.", "lista": "Cuando un comportamiento raro provocado en una prueba genera el aviso en el admin."}, "063092ea837b": {"titulo": "Que la webapp recuerde más y refresque solo lo que cambió", "que": "Tres mejoras: que la webapp recuerde quién eres por un rato en vez de preguntarlo en cada pantalla, que cargue por adelantado lo que vas a ver, y que cuando algo cambia en vivo se actualice solo eso y no la pantalla entera.", "porque": "Hace todo más rápido y liviano, pero es para después del 6 de diciembre: no bloquea el evento.", "lista": "Cuando medimos menos pedidos por pantalla y un cambio en vivo actualiza solo lo que cambió."}, "e629e52a2ea3": {"titulo": "Quitar consultas repetidas y volver a medir el límite de cada pantalla", "que": "Hay preguntas a la base de datos que se hacen dos veces al revisar quién eres, y un conteo que se repite al cargar la marca del evento (colores, logo). La idea es quitar esas repeticiones y después volver a medir cuánta gente aguanta cada pedido.", "porque": "Es para después del 6 de diciembre: el servidor aguanta sin esto, pero gana margen.", "lista": "Cuando las repeticiones desaparecen y quedan publicadas las nuevas medidas."}, "ab4994bdc363": {"titulo": "Panel de rendimiento con Pulse y una persona de prueba automática", "que": "Laravel Pulse es un panel que muestra cómo está trabajando el backend. El \"canario\" es una persona de prueba que navega sola todo el tiempo y avisa si la app se siente lenta. Son la segunda y tercera capa de vigilancia, si no quedan cubiertas por la torre de control.", "porque": "Es para después del 6 de diciembre: la alerta al teléfono y la torre de control cubren lo esencial del evento.", "lista": "Cuando el panel muestra datos reales y la persona de prueba avisa si provocamos lentitud."}, "7f806154d6df": {"titulo": "Página pública de estado, tamaños para 10.000 y otro proveedor", "que": "Tres cosas para crecer: una página pública donde los clientes vean si la plataforma está funcionando, tamaños de servidor pensados para 10.000 personas, y poder montar todo en un proveedor distinto de DigitalOcean con tiempos de recuperación prometidos (cuánto tarda en volver y cuántos datos se podrían perder).", "porque": "Es para después del 6 de diciembre: sirve para venderles a clientes más grandes, no para este evento.", "lista": "Cuando la página de estado está publicada y el montaje en otro proveedor se probó al menos una vez."}, "612e8ad86846": {"titulo": "Prueba de esfuerzo con 10.000 personas", "que": "Repetir las pruebas grandes con 10.000 personas: dos horas seguidas de carga, apagar máquinas y ver que otras toman el relevo, bajar reportes sin afectar la app, y subir la carga hasta encontrar dónde se rompe.", "porque": "Es para después del 6 de diciembre: dice hasta qué tamaño de evento se puede vender.", "lista": "Cuando las cuatro pruebas corrieron y sabemos el punto exacto donde se rompe."}, "fee92aebd68f": {"titulo": "Actualizar y borrar con el proceso automático, y probarlo completo", "que": "Sumarle al proceso automático de montaje sus hermanos: uno para actualizar a un cliente (primero una máquina, se prueba, y luego el resto) y otro para borrar todo. Y probar que los niveles 0 y 1 se montan de cero sin tocar nada a mano.", "porque": "Es para después del 6 de diciembre: es lo que deja atender varios clientes sin trabajo a mano.", "lista": "Cuando actualizar y borrar funcionan con un comando y los niveles 0 y 1 se montan de cero solo con el proceso."}, "a09329e6c982": {"titulo": "Revisar si algo del plan de servidor de abril todavía sirve", "que": "En abril se escribió un plan de servidor con otras herramientas: Docker, cambios de versión sin cortes y el Data Center en su propia máquina. Ya lo reemplazó el plan actual. Al terminar el montaje automático hay que revisar si alguna idea de ese plan sigue sirviendo y descartar el resto.", "porque": "Es para después del 6 de diciembre: es limpieza, para no cargar con un plan viejo que confunde.", "lista": "Cuando cada punto del plan de abril está marcado como \"se usa\" o \"se descarta\"."}, "ec751d37be4f": {"titulo": "Que las pruebas automáticas no dependan de servicios prendidos", "que": "El proyecto tiene unas 950 pruebas automáticas que revisan que nada se rompa. Hoy, al correr, intentan hablar con el tiempo real y con la webapp de verdad, y si están apagados se quedan esperando. Por eso la revisión completa tarda unos 30 minutos o no termina. Hay que hacer que las pruebas simulen esas llamadas en vez de hacerlas.", "porque": "Si las pruebas tardan media hora, no se corren seguido, y los errores se escapan justo en las semanas antes del 6 de diciembre.", "lista": "Cuando la revisión completa corre en minutos con el tiempo real y la webapp apagados, y da el mismo resultado que con todo prendido."}, "18b4c8f8467b": {"titulo": "Evitar que las pruebas borren la base de datos de trabajo", "que": "En ciertas condiciones, las pruebas automáticas pueden terminar usando la base de datos de trabajo en vez de una de mentiras, y al arrancar la borran y la arman de cero. Hoy se evita con un paso manual antes de probar. Falta que las pruebas se nieguen solas a correr si no están en la base de mentiras.", "porque": "Un descuido aquí puede borrar todos los datos de prueba del evento. Depender de acordarse del paso manual es arriesgado.", "lista": "Cuando las pruebas se detienen con un aviso claro si detectan que van contra la base de datos de trabajo."}, "997802a6ee0a": {"titulo": "Arreglar una prueba de las estadísticas que siempre falla", "que": "Hay una prueba automática del Data Center (las estadísticas del organizador) que falla siempre. El código está bien: en abril se cambió para que los números se actualicen al instante, y la prueba sigue esperando el comportamiento viejo. Hay que reescribirla para que pruebe lo que hace hoy.", "porque": "Una prueba que siempre falla acostumbra a ignorar las fallas. Es de prioridad baja, pero estorba.", "lista": "Cuando la prueba pasa y comprueba que un asistente nuevo aparece de inmediato en las estadísticas."}, "66500a6fcbbf": {"titulo": "Comprobar que los correos salen a buen ritmo sin perderse", "que": "Resend, el servicio que manda los correos, solo acepta unos 10 envíos por segundo. Antes, si se pasaba de ese límite, los correos se reintentaban tres veces y se perdían. Ya está el código que los manda a un ritmo seguro y le da prioridad a los enlaces de acceso. Falta medirlo para cerrarlo.", "porque": "El 6 de diciembre pueden ser 5.000 personas pidiendo su enlace de entrada al mismo tiempo. Si los correos se pierden, la gente no entra.", "lista": "Cuando una prueba con miles de correos muestra que todos llegan y ninguno se pierde."}, "0b7965bd95c4": {"titulo": "El contador de mensajes de Event Pulse no cuadra", "que": "Event Pulse, la pantalla que muestra en vivo cómo va el evento, dice que hay 84 mensajes, pero en la base de datos hay 2.156. Puede que esté contando solo una parte a propósito o que sea un error. Hay que revisar qué está contando.", "porque": "Si un número del tablero no cuadra, el cliente deja de confiar en todos los demás.", "lista": "Cuando sabemos qué cuenta ese número y coincide con la base de datos, o su nombre explica bien qué mide."}, "273e385a4bee": {"titulo": "Revisar los 57 avisos de seguridad de las piezas del backend", "que": "El backend está armado con piezas hechas por otros (librerías). Una revisión automática encontró 57 avisos en 19 de esas piezas, y nadie los ha mirado. Hay que ver cuáles son graves y actualizar esas piezas.", "porque": "Una pieza con un hueco conocido es una puerta abierta. Mejor cerrarlo antes de abrir el evento al público.", "lista": "Cuando cada aviso está revisado y los graves quedaron resueltos con la pieza actualizada."}, "e895ffb454bf": {"titulo": "Un botón para cambiar entre tema oscuro y claro en el demo", "que": "Hoy, para ver la landing en oscuro o en claro, hay que cambiar algo a mano en la dirección de la página. La idea es un botón flotante que lo cambie, visible solo en modo demo, porque en una landing real el asistente no debe cambiar el diseño que eligió el organizador. El cambio se mantiene en la confirmación y el widget. Antes de hacerlo, ver en lab dos opciones: una píldora abajo a la derecha o una barra fina arriba.", "porque": "Al mostrarle el producto a un cliente, cambiar de tema con un clic se ve mucho mejor que tocar la dirección.", "lista": "Cuando eliges una de las dos opciones en lab y el botón funciona en landing, confirmación y widget, solo en modo demo."}, "edbed4ddff81": {"titulo": "Que la escarapela muestre si eres VIP, Prensa u otra etiqueta", "que": "En el admin, cada asistente puede tener etiquetas como VIP o Prensa. La idea es poder marcar cuáles de esas etiquetas salen en la escarapela digital. Es una idea tuya para más adelante.", "porque": "Ayuda al personal del evento a reconocer de un vistazo quién es quién. No es urgente para el 6 de diciembre.", "lista": "Cuando marcas una etiqueta en el admin y aparece en la escarapela del asistente."}, "15b58d2f17c6": {"titulo": "No decir \"ya tenías tu lugar\" a quien se registró en otro evento", "que": "Cuando alguien se registra con un correo que ya existe, le sale \"ya tenías tu lugar\". El problema es que también sale si ese correo está en otro evento y no en este. Hay que revisar solo el evento actual.", "porque": "Si alguien fue a un evento anterior y se inscribe a este, creería que ya estaba inscrito y podría quedarse sin cupo.", "lista": "Cuando un correo registrado solo en otro evento se inscribe normal en este, sin ese mensaje."}, "939c6bf03a02": {"titulo": "Imagen al compartir el enlace cuando el evento no tiene una propia", "que": "Cuando alguien comparte el enlace del evento por WhatsApp o redes, aparece una tarjeta con imagen. Si el organizador no subió esa imagen, la tarjeta sale sin foto. La idea es armarla sola con el nombre, la fecha, el lugar y el color del evento. Necesita lab antes.", "porque": "Un enlace compartido sin imagen se ve descuidado y menos gente le da clic.", "lista": "Cuando apruebas el diseño en lab y un evento sin imagen se comparte con su tarjeta generada."}, "858173b0ac8e": {"titulo": "Probar la tarjeta del enlace en WhatsApp, LinkedIn y X ya publicada", "que": "La tarjeta con imagen que sale al compartir el enlace solo se puede probar de verdad cuando la página está publicada en internet, porque desde el computador las redes no ven la imagen. Hay que compartir el enlace real en cada red y mirar cómo se ve.", "porque": "Es lo primero que ven los invitados cuando les pasan el enlace del evento.", "lista": "Cuando la tarjeta sale bien en WhatsApp, LinkedIn y X con la dirección real."}, "8b3579d8d3e3": {"titulo": "Escanear un QR en un stand sin tener que volver a entrar", "que": "Cuando alguien escanea el QR de un stand, los puntos deben sumarse a la cuenta con la que ya entró, sin pedirle iniciar sesión otra vez. En Bintec Play pasó lo contrario: no te dejó entrar.", "porque": "Cada paso de más hace que la gente abandone. Si escanear es inmediato, los stands de los patrocinadores reciben más visitas.", "lista": "Cuando una persona con sesión abierta escanea un QR y los puntos se suman sin ninguna pantalla de ingreso."}, "cc59d379f1dc": {"titulo": "Más opciones en cada sesión de la agenda, y Outlook además de Google", "que": "En la ficha de cada sesión, la idea es que la persona pueda marcar tres cosas distintas: me interesa, favorito o voy a ir en persona. Y además de Google Calendar, poder agregarla a Outlook. Antes hay que revisar qué tenemos hoy para no repetir.", "porque": "En las empresas grandes casi todos usan Outlook. Y saber quién va en persona ayuda al organizador a preparar las salas.", "lista": "Cuando la ficha tiene las tres opciones y la sesión se agrega bien a Outlook y a Google."}, "76fd3fb46ea2": {"titulo": "Revisar las protecciones básicas de seguridad de la webapp", "que": "Las páginas web le pueden mandar al navegador unas instrucciones que lo protegen, por ejemplo que otra página no pueda meter la nuestra adentro para engañar a la gente. Hay que revisar que la webapp y el backend las tengan. Y también que ningún registro use un dato fácil de conocer, como la cédula, como contraseña.", "porque": "Los clientes corporativos revisan esto antes de firmar, y protege a los asistentes de engaños.", "lista": "Cuando una revisión de la página muestra todas esas protecciones activas y ningún registro usa la cédula como contraseña."}, "36d1b94c9b0c": {"titulo": "Tener un plan B para el chat si somos demasiados", "que": "El chat funciona con nuestro propio sistema de tiempo real. Si la medición con 5.000 personas muestra que no aguanta, la idea es usar un servicio externo como Ably, que se dedica a eso, solo para ese evento. No es rehacer todo, es tener la opción.", "porque": "El chat del streaming es de lo que más se usa en un evento grande. Si se cae el 6 de diciembre, se nota de inmediato.", "lista": "Cuando la medición de 5.000 diga si hace falta y, si hace falta, el chat funcione con el servicio externo en ese evento."}, "86c4e9a3c942": {"titulo": "Que el video en vivo siga corriendo aunque cambies de pantalla", "que": "Hoy, si estás viendo el streaming y te vas a otra parte de la webapp, el video se cierra. La idea es que el reproductor viva en la estructura general de la webapp y no en esa página, para que siga corriendo mientras navegas, como en YouTube.", "porque": "Es la base de todo lo demás del reproductor: sin esto, nadie puede mirar la agenda sin perderse la charla.", "lista": "Cuando el video sigue sin cortarse ni recargar al pasar a otras pantallas."}, "04f87f1d2d6c": {"titulo": "Ver el video y la agenda lado a lado", "que": "Si estás en el streaming y abres la agenda, la pantalla se parte en dos: el video a la izquierda y la agenda a la derecha. Si das clic en otra sesión que también se transmite, cambia el video sin salir. Si la sesión no se transmite, se abre su ficha normal.", "porque": "La gente quiere ver qué sigue sin perderse la charla actual.", "lista": "Cuando, desde el streaming, abres la agenda, el video queda a la izquierda sin cortarse y puedes cambiar de sesión."}, "61268d1303e7": {"titulo": "Video en una ventanita flotante mientras usas el resto de la webapp", "que": "Si vas a cualquier otra pantalla, el video se encoge a una ventanita en la esquina de abajo a la derecha, que puedes arrastrar, con botones para volver o cerrar. El chat y las preguntas se esconden pero siguen conectados por debajo. Los avisos de trivia o ruleta siguen llegando.", "porque": "Así la persona puede ir al networking o a los juegos sin dejar de ver la charla, y se queda más tiempo en el evento.", "lista": "Cuando, en cualquier pantalla, el video sigue en la ventanita, se puede arrastrar y los avisos de juegos siguen llegando."}, "c2f75b36739e": {"titulo": "Volver al video en grande justo donde ibas", "que": "Desde la ventanita o desde la pantalla partida, un clic en el video o en \"En vivo\" lo devuelve a pantalla completa. El chat debe quedar donde ibas, sin volver a cargar todo.", "porque": "Si al volver todo se recarga, la persona pierde el hilo y la experiencia se siente rota.", "lista": "Cuando vuelves al video en grande y el chat está en el mismo punto, sin recargar."}, "9637d8835b64": {"titulo": "El video flotante en el celular, como en la app de YouTube", "que": "En el celular no cabe la pantalla partida. Ahí, al salir del streaming, el video queda como una barra encima del menú de abajo, con miniatura, título, pausa y cerrar. Si abres la agenda, la agenda ocupa la pantalla y el video sigue en la barra.", "porque": "La mayoría de asistentes van a usar el celular el día del evento.", "lista": "Cuando en un celular el video sigue en la barra al navegar y se puede pausar o cerrar."}, "e9add8725a2e": {"titulo": "Que la portada de En vivo muestre el video de verdad", "que": "Hoy la página de En vivo muestra una imagen fija de la transmisión destacada. La idea es que muestre el video corriendo sin sonido. Ya decidiste: en computador el video corre siempre sin sonido; en celular, al tocar, se ven 4 segundos de video y luego entra, porque el celular no deja arrancar video solo.", "porque": "Un video en movimiento invita a entrar mucho más que una foto, y se ve vivo para el cliente.", "lista": "Cuando en computador el video corre sin sonido en la portada y en celular el toque muestra 4 segundos y entra."}, "c2d8b1d93305": {"titulo": "Que las tarjetas de las otras salas en vivo se muevan", "que": "Al lado de la transmisión principal hay tarjetas de las otras salas en vivo. La idea es mostrar en cada una una miniatura del video sin sonido o, si son varias, ir rotando cada 8 segundos con un solo video extra, porque tres videos de YouTube al tiempo ponen lenta la página. Falta tu decisión.", "porque": "Ayuda a que la gente descubra otras salas, pero no es urgente.", "lista": "Cuando decides la opción y las tarjetas se mueven sin que la página se ponga lenta."}, "3a24c5406fc1": {"titulo": "Qué pasa con el video cuando la sesión termina", "que": "Cuando la sesión que estás viendo termina, la ventanita debe decir \"Terminó, ver siguiente\" y ofrecer la próxima sesión de la misma sala, que el sistema ya conoce. Si el evento completo termina, el reproductor se apaga solo.", "porque": "Sin esto, la persona queda mirando una pantalla quieta y no sabe qué sigue.", "lista": "Cuando, al terminar una sesión, aparece la siguiente de la misma sala, y al cerrar el evento el video se apaga."}, "d2aff9888d80": {"titulo": "Probar contigo todo el recorrido del video en vivo", "que": "Hacer juntos el recorrido completo: del streaming a la agenda partida, de ahí a la ventanita, volver a grande, la portada de En vivo y otra sala. En computador, tablet y celular. También con el tiempo real apagado, para ver que no salgan errores. Y comprobar que el video no se recarga en ningún paso.", "porque": "Es la prueba final del reproductor antes de darlo por listo para el evento.", "lista": "Cuando haces el recorrido en los tres tamaños y el video nunca se recarga ni aparecen errores."}, "545aa447ccbe": {"titulo": "Sugerir la corrección del correo también al editarlo", "que": "Cuando alguien escribe mal su correo, por ejemplo gmial en vez de gmail, la webapp le sugiere la corrección. Pero si cambia el correo en el paso de la contraseña, esa sugerencia no aparece. Hay que ponerla también ahí.", "porque": "Un correo mal escrito significa que el enlace de acceso nunca le llega a esa persona.", "lista": "Cuando escribir mal el correo en el paso de la contraseña muestra la sugerencia."}, "45ffe3f47261": {"titulo": "Que calificar, pedir soporte y editar el perfil respondan al instante", "que": "Al calificar una sesión, mandar una solicitud de soporte o guardar el perfil, hoy hay que esperar a que el servidor confirme. La idea es que la pantalla muestre el cambio de una vez y confirme por detrás. Ojo: antes se decidió que los formularios que pueden rechazar datos deben esperar, así que hay que revisarlo primero.", "porque": "La webapp se siente más rápida, sobre todo con el wifi lento de un evento.", "lista": "Cuando calificar se ve al instante y queda claro, caso por caso, qué formularios sí deben esperar."}, "5360120df172": {"titulo": "Compartir tu puesto del ranking en redes", "que": "Un botón para que cada persona comparta en redes su posición en el ranking de puntos del evento. Quedó para después cuando se cerró el módulo de juegos.", "porque": "Cada vez que alguien lo comparte, el evento y la plataforma se ven afuera. Es para después del 6 de diciembre.", "lista": "Cuando el botón deja compartir tu posición en las redes principales."}, "ed1b6b796949": {"titulo": "Tres pruebas automáticas que faltan en speakers y agenda (opcional)", "que": "Hay tres pruebas pequeñas que estaban en la lista y no se escribieron: la carga de speakers, su pantalla y el resaltado de una sesión en la agenda. Una prueba más grande ya revisa ese recorrido completo, por eso es opcional.", "porque": "Daría más tranquilidad al cambiar esas pantallas, pero no frena nada del evento.", "lista": "Cuando las tres pruebas existen y pasan."}, "60ddab0ba115": {"titulo": "Configurar WhatsApp y SMS desde el admin", "que": "Hoy desde el admin se configura el envío de correos. La idea es poder configurar también mensajes por WhatsApp y SMS. Es algo deseable, no necesario.", "porque": "A algunos clientes les sirve llegar por WhatsApp, que se lee más que el correo. Es para después del evento.", "lista": "Cuando un organizador conecta WhatsApp o SMS desde el admin y un mensaje de prueba llega."}, "4eab4e2ca999": {"titulo": "Elegir en el admin qué etiquetas salen en la escarapela", "que": "Cada asistente puede tener etiquetas como VIP o Prensa. La idea es que en el admin se marque cuáles se muestran en su escarapela. Es la misma idea de la escarapela con etiqueta, vista desde el admin.", "porque": "Ayuda al personal del evento a reconocer quién es quién. No es urgente para el 6 de diciembre.", "lista": "Cuando marcas una etiqueta en el admin y aparece en la escarapela."}, "7fa3c7f5ac43": {"titulo": "Decidir qué hacer con las páginas personalizadas, después del montaje", "que": "Hay una función para que el organizador meta páginas propias, como un video de YouTube, un Slido o un mapa. Está construida en un 60 %, pero ninguna pantalla la muestra, así que nadie llega a ella. Decidiste dejarla en pausa, visible como deshabilitada en el admin. Al retomarla hay dos caminos: terminar el acceso (más o menos una sesión de trabajo) o borrarla entera.", "porque": "No ayuda ni estorba para el evento, por eso queda para el final. Lo hecho no se pierde.", "lista": "Cuando decides terminarla o borrarla y queda hecho lo que decidiste."}, "3bd795a5a973": {"titulo": "Correr la revisión de seguridad con la configuración real del servidor", "que": "Ya existe una revisión automática que mira si la configuración tiene errores peligrosos, como contraseñas de prueba o el evento demo. Hay que correrla con la configuración real del servidor, cuando se monte.", "porque": "Una sola configuración de prueba olvidada en el servidor real puede dejar entrar a quien no debe.", "lista": "Cuando la revisión corre en el servidor real y sale sin problemas."}, "ea749e3f2495": {"titulo": "Entrar al admin con huella o Face ID", "que": "Hoy el personal entra al admin con contraseña y un código de una app en el celular. La idea es que también pueda entrar con la huella o la cara, como en el banco. La pediste el 1 de agosto, sin fecha.", "porque": "Es más cómodo y más seguro, pero no hace falta para el 6 de diciembre.", "lista": "Cuando una persona del equipo entra al admin con su huella o Face ID."}, "3bf54c2451cb": {"titulo": "Que cada mensaje del chat muestre si se envió", "que": "Hoy, al mandar un mensaje en el chat, no queda claro si llegó. La idea es que aparezca de una vez como enviando y cambie a enviado cuando el servidor lo confirme, como en WhatsApp. Son 2 o 3 horas de trabajo en la app y en el tiempo real.", "porque": "Con el wifi lento de un evento, la gente reenvía mensajes que creyó perdidos y el chat se llena de repetidos.", "lista": "Cuando cada mensaje muestra enviando y luego enviado, y no aparece duplicado."}, "3eff5c6074c6": {"titulo": "Que tu emoji en el streaming no salga dos veces", "que": "Cuando mandas un emoji en el streaming, se te muestra dos veces: el tuyo y el que te devuelve el tiempo real. Hay que hacer que el que rebota no se te muestre a ti. Unos 30 minutos.", "porque": "Es un detalle pequeño, pero se nota y hace ver la plataforma descuidada.", "lista": "Cuando mandas un emoji y lo ves una sola vez."}, "2c6612a25418": {"titulo": "Que un comentario en el muro social no salga repetido", "que": "Al comentar en el muro social, el comentario puede aparecer dos veces: el que pusiste y el que llega por el tiempo real. Hay que quitar el repetido. Unos 20 minutos.", "porque": "Un comentario duplicado se ve como un error y confunde.", "lista": "Cuando comentas en el muro y el comentario aparece una sola vez."}, "50bbf7755f5d": {"titulo": "Que el contador de votos de las preguntas no parpadee", "que": "En las preguntas al speaker, al votar una pregunta el número parpadea. Hay que dejarlo estable. Unos 15 minutos.", "porque": "Es un detalle pequeño, pero en una pantalla proyectada se nota.", "lista": "Cuando votas una pregunta y el número sube una vez, sin parpadear."}, "8efb80b78d9e": {"titulo": "Pruebas automáticas de las acciones que no pueden fallar", "que": "Pruebas que hacen solas, como si fueran una persona, las acciones clave: aprobar una pregunta, lanzar un juego, cancelar una sesión y disparar una exportación programada.", "porque": "Si un cambio rompe algo de esto, nos enteramos antes del evento y no en pleno 6 de diciembre.", "lista": "Cuando las cuatro pruebas existen y pasan."}, "dced1dd2997c": {"titulo": "Revisar cómo entra el personal al admin y cuándo vence su sesión", "que": "Entender y revisar cómo funciona la entrada al admin y cuánto dura una sesión abierta antes de pedir entrar otra vez. Lo anotaste tú y encaja con el trabajo de seguridad del personal.", "porque": "Una sesión que no vence nunca es un riesgo si alguien deja el computador abierto en el evento.", "lista": "Cuando está escrito cómo funciona y cuánto dura la sesión, y lo que haya que ajustar quedó ajustado."}, "6a38a940c273": {"titulo": "Poner el monitor del chat con el mismo estilo del resto", "que": "El monitor del chat es una pantalla aparte para seguir los mensajes. Usa íconos y colores viejos. Hay que pasarlo a los mismos íconos y colores del resto de la plataforma.", "porque": "Es un detalle visual: se ve mejor cuando un cliente lo mira, pero no cambia cómo funciona.", "lista": "Cuando el monitor se ve con los mismos íconos y colores que el resto, en oscuro y en claro."}, "608e312b43e4": {"titulo": "Un buscador rápido para saltar a cualquier parte de la webapp", "que": "Una cajita de búsqueda que se abre encima de todo y te deja escribir para ir directo a una sesión, un speaker o una sección, sin navegar por los menús.", "porque": "Es una comodidad para usuarios frecuentes. Queda para después del evento.", "lista": "Cuando la cajita se abre, encuentra sesiones, speakers y secciones, y te lleva a ellas."}, "049f64cc2c86": {"titulo": "Avisar a quien no tiene contraseña e intenta entrar con una", "que": "Ahora la gente se puede registrar sin crear contraseña y entra con un enlace al correo. Si luego intenta entrar con una contraseña, no entiende por qué no puede. La idea es avisarle que su cuenta no tiene contraseña y ofrecerle el enlace.", "porque": "Desde que existe el registro sin contraseña, esto le puede pasar a mucha gente el día del evento.", "lista": "Cuando alguien sin contraseña intenta usar una y la pantalla le explica qué hacer y le ofrece el enlace."}, "993278b1e1b8": {"titulo": "Compartir la agenda o el muro ya filtrados con un enlace", "que": "Si filtras la agenda o el muro social, por ejemplo por un tema, ese filtro no queda guardado en el enlace. La idea es que sí quede, para que al compartirlo la otra persona vea lo mismo que tú.", "porque": "Sirve, por ejemplo, para que el organizador mande el enlace con solo las sesiones de un tema. Es para después.", "lista": "Cuando abres un enlace copiado con filtros y la agenda o el muro aparecen ya filtrados."}, "261e24819f15": {"titulo": "Tarjetas más grandes para las personas sugeridas en networking", "que": "En networking, la plataforma te sugiere personas para conocer. La idea es mostrarlas en tarjetas más grandes, para que den más ganas de conectar.", "porque": "Las conexiones entre asistentes son de lo que más valoran los organizadores. Es para después del evento.", "lista": "Cuando las sugerencias se ven en tarjetas grandes con un diseño aprobado en lab."}, "53819e46479a": {"titulo": "Avisar cuando dos de tus favoritas caen a la misma hora", "que": "Si marcas como favoritas dos sesiones que se cruzan en horario, la agenda debería avisarte para que elijas una.", "porque": "Evita que alguien descubra el cruce ya en el evento, corriendo entre salas.", "lista": "Cuando marcas dos sesiones que se cruzan y la agenda muestra el aviso."}, "5b15414da0f8": {"titulo": "Nuevos juegos: subasta de puntos, buscar al patrocinador, citas rápidas", "que": "Ideas de juegos para más adelante: subastar algo con los puntos ganados, un juego de \"¿dónde está el sponsor?\" y un speed-dating, que son conversaciones cortas entre asistentes. Van junto con los juegos cortos por QR.", "porque": "Más juegos dan más vida al evento y más visibilidad a los patrocinadores. No es para el 6 de diciembre.", "lista": "Cuando cada juego tiene diseño aprobado en lab y funciona de punta a punta."}, "e18eeaffe838": {"titulo": "Que los datos de un asistente salgan siempre con la misma forma", "que": "Hoy distintas partes del backend arman los datos de un asistente a su manera. La idea es tener una sola forma común para todas las pantallas. Es orden interno que no se ve.", "porque": "Evita errores raros cuando una pantalla espera un dato que otra parte no manda. No es urgente para el evento.", "lista": "Cuando todas las pantallas reciben al asistente con la misma forma y las pruebas pasan."}, "012b8d2ff10f": {"titulo": "Ordenar el muro social por más likes desde el servidor", "que": "La idea es que, al pedir el muro ordenado por los más populares, el servidor lo entregue ya ordenado por likes. Así el orden incluye todas las publicaciones del evento y no solo las que el celular alcanzó a cargar.", "porque": "Con muchas publicaciones el orden podría salir incompleto. Es para después del evento.", "lista": "Cuando el muro ordenado por likes muestra primero las más populares de todo el evento."}, "24bc64bd1a7d": {"titulo": "Medir qué hace la gente en networking y qué perfiles visita", "que": "Registrar más acciones de los asistentes: cuando abren o cierran un perfil, mandan una solicitud de conexión, le agregan un mensaje o tocan un dato de contacto. Y cuántas visitas tiene cada patrocinador, speaker y sesión.", "porque": "Esos números son lo que el organizador le muestra a sus patrocinadores para justificar lo que pagaron.", "lista": "Cuando esas acciones se cuentan y se ven en las estadísticas del organizador."}, "a68753a9fec8": {"titulo": "Puntos extra por entrar a la app varios días seguidos", "que": "Una racha: si la persona entra a la app días seguidos, gana puntos de bonificación.", "porque": "Sirve en eventos de varios días o en la previa, para que la gente vuelva. No es para el 6 de diciembre.", "lista": "Cuando entrar dos días seguidos suma el bonus y se ve en los puntos de la persona."}, "2974f8c75089": {"titulo": "Lista de espera cuando se llena el cupo", "que": "Cuando el evento llega a su cupo máximo, hoy no se puede inscribir más gente. La idea es que la persona quede en lista de espera y le llegue un aviso si se libera un lugar.", "porque": "En eventos con mucha demanda, el organizador no pierde a esos interesados. Es para después.", "lista": "Cuando, con el cupo lleno, alguien queda en lista de espera y recibe el aviso al liberarse un lugar."}, "f0ec551ce341": {"titulo": "Saber quién trajo a quién al evento", "que": "Darle a cada persona su propio enlace para invitar a otros y contar cuántos se registraron gracias a ella.", "porque": "Al organizador le sirve para premiar a quien más invita y saber qué canales funcionan. Es para después.", "lista": "Cuando alguien se registra con un enlace de invitación y queda claro a
