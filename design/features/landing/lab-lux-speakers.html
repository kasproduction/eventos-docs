<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Speakers Lux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   MINILAB — speakers de Lux sin flechas. 3 opciones en pestañas.
   Lenguaje Lux: borde que se dibuja + tinte, frenada suave, sin rebote.
   ===================================================================== */
:root { --accent: #3D6BFF; --on-accent: #fff; --bg: #F2EEE7; --card: #FBF9F5; --card2: #EAE4DA; --fg: #141414; --mut: rgba(20,20,20,.6); --mut2: rgba(20,20,20,.42); --line: rgba(20,20,20,.12); --out: cubic-bezier(.16,1,.3,1); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Urbanist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--fg); overflow-x: hidden; }
img { display: block; max-width: 100%; }
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: #0b0b0c; color: #fff; font-size: 13px; flex-wrap: wrap; }
.bar b { font-family: 'Plus Jakarta Sans'; font-weight: 800; }
.seg { display: flex; background: rgba(255,255,255,.06); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font: 600 13px 'Urbanist'; color: rgba(255,255,255,.6); cursor: pointer; }
.seg button.on { background: #fff; color: #0b0b0c; }
.sw { display: flex; gap: 6px; }
.sw button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; }
.sw button.on { border-color: #fff; }

.sec { max-width: 1440px; margin: 0 auto; padding: 96px 48px 140px; }
.kick { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; color: var(--mut); margin-bottom: 18px; }
.kick::before { content: ""; width: 28px; height: 2px; background: var(--accent); }
h2 { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: clamp(36px, 5.4vw, 84px); line-height: .95; letter-spacing: -.04em; margin: 0 0 56px; }
h2 em { font-style: normal; color: var(--accent); }
.opt { display: none; } .opt.on { display: block; }

/* ---------- 1 INDICE EDITORIAL ---------- */
.idx { border-top: 1px solid var(--line); }
.ix { position: relative; display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); cursor: default; }
.ix::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .9s var(--out); }
.ix:hover::after { transform: scaleX(1); }
.ix b { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: clamp(34px, 5.6vw, 88px); letter-spacing: -.045em; line-height: .95; transition: color .6s var(--out), transform .8s var(--out); }
.ix:hover b { color: var(--accent); transform: translateX(14px); }
.ix .rl { font-size: 16px; color: var(--mut); line-height: 1.4; transition: opacity .5s; }
.ix .rl strong { display: block; color: var(--fg); font-weight: 600; }
.idx:hover .ix:not(:hover) b { color: color-mix(in srgb, var(--fg) 22%, transparent); }
.float { position: fixed; left: 0; top: 0; z-index: 15; width: 300px; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.94); transition: opacity .45s var(--out), transform .6s var(--out); }
.float.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.float .ph { aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden; background: var(--card2); box-shadow: 0 30px 70px rgba(60,45,25,.22); position: relative; }
.float img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s var(--out); }
.float img.on { opacity: 1; }
.float q { display: block; margin-top: 14px; font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: 18px; line-height: 1.3; letter-spacing: -.02em; color: var(--fg); background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: 0 16px 40px rgba(60,45,25,.12); }

/* ---------- 2 RETRATO PROTAGONISTA ---------- */
.hero2 { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: start; }
.stage { position: sticky; top: 80px; }
.stage .ph { position: relative; aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; background: var(--card2); }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: brightness(1.9) saturate(.2); transform: scale(1.04); transition: opacity .9s var(--out), filter 1.4s var(--out), transform 1.6s var(--out); }
.stage img.on { opacity: 1; filter: brightness(1) saturate(1); transform: none; }
.stage .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 30px 28px; background: linear-gradient(0deg, rgba(0,0,0,.66), transparent); color: #fff; }
.stage q { display: block; font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: clamp(22px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -.025em; }
.stage .cap small { display: block; margin-top: 14px; font-size: 15px; color: rgba(255,255,255,.8); }
.stage .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; }
.list2 { display: grid; gap: 10px; }
.li { position: relative; isolation: isolate; border-radius: 20px; padding: 18px 22px; display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: center; cursor: pointer; }
.li::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: color-mix(in srgb, var(--accent) 8%, var(--card)); opacity: 0; transition: opacity .7s var(--out); }
.li.on::before { opacity: 1; }
.li svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.li svg rect { width: calc(100% - 2px); height: calc(100% - 2px); fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1s var(--out); }
.li.on svg rect { stroke-dashoffset: 0; }
.li img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; filter: grayscale(1); transition: filter .7s var(--out); }
.li.on img { filter: none; }
.li b { display: block; font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 24px; letter-spacing: -.025em; transition: color .6s var(--out); }
.li.on b { color: var(--accent); }
.li span { font-size: 15px; color: var(--mut); }

/* ---------- 3 MOSAICO EDITORIAL ---------- */
.mos { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 170px; gap: 14px; }
.mc { position: relative; isolation: isolate; border-radius: 24px; overflow: hidden; background: var(--card2); }
.mc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: filter .9s var(--out), transform 1.4s var(--out); }
.mc:hover img { filter: none; transform: scale(1.03); }
.mc .tx { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px; color: #fff; background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); }
.mc .tx b { display: block; font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.mc .tx span { font-size: 13.5px; color: rgba(255,255,255,.8); }
.mc .tx q { display: block; font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: 17px; line-height: 1.25; margin-bottom: 10px; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .8s var(--out), opacity .6s var(--out); }
.mc:hover .tx q { max-height: 120px; opacity: 1; }
.mc.k .tx b { font-size: 34px; } .mc.k .tx q { font-size: 24px; max-height: 200px; opacity: 1; }
.mc svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.mc svg rect { width: calc(100% - 4px); height: calc(100% - 4px); fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1s var(--out); }
.mc:hover svg rect { stroke-dashoffset: 0; }

@media (max-width: 900px) {
  .sec { padding: 64px 16px 96px; }
  .ix { grid-template-columns: 1fr; gap: 6px; }
  .hero2 { grid-template-columns: 1fr; gap: 20px; } .stage { position: relative; top: 0; }
  .li { padding: 12px 14px; grid-template-columns: 44px 1fr; } .li img { width: 44px; height: 44px; } .li b { font-size: 19px; }
  .mos { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; } .mc { grid-column: span 1 !important; grid-row: span 1 !important; } .mc.k { grid-column: span 2 !important; grid-row: span 2 !important; }
  .float { display: none; }
}
</style>
</head>
<body>
<div class="bar"><b>Speakers de Lux</b>
  <div class="seg" id="seg"><button data-o="1" class="on">1 Índice editorial</button><button data-o="2">2 Retrato protagonista</button><button data-o="3">3 Mosaico editorial</button></div>
  <span style="color:rgba(255,255,255,.5)">Color del cliente</span>
  <div class="sw" id="sw"><button data-c="#3D6BFF" style="background:#3D6BFF" class="on"></button><button data-c="#E5192B" style="background:#E5192B"></button><button data-c="#FF6A13" style="background:#FF6A13"></button><button data-c="#C9A86A" style="background:#C9A86A"></button></div>
</div>

<section class="sec">
  <div class="kick">Speakers</div>
  <h2>Las voces<br>de este <em>año</em></h2>
  <div class="opt on" id="o1"><div class="idx" id="idx"></div></div>
  <div class="opt" id="o2"><div class="hero2"><div class="stage"><div class="ph" id="stg"></div></div><div class="list2" id="list2"></div></div></div>
  <div class="opt" id="o3"><div class="mos" id="mos"></div></div>
</section>
<div class="float" id="float"><div class="ph" id="fph"></div><q id="fq"></q></div>

<script>
const SPEAKERS = [
  ['María García', 'CEO y fundadora', 'Kasproduction', 47, 'Un evento no se mide por cuánta gente llega, sino por cuánta sale distinta.', 'Apertura: el futuro del trabajo corporativo'],
  ['Sofia Chen', 'VP of Product', 'Google', 25, 'La IA dejó de ser una promesa. Ahora es una decisión de negocio.', 'The State of AI: from hype to production'],
  ['Carlos Rodríguez', 'CTO', 'TechCorp', 12, 'La nube no es un lugar, es una forma de trabajar.', 'Workshop: Cloud Native en 90 minutos'],
  ['Laura Díaz', 'Founder y CEO', 'NovaPay', 26, 'En Latam, regular bien es la mayor ventaja competitiva.', 'Fintech en Latam: regulación y oportunidad'],
  ['Valentina Ríos', 'Design Lead LATAM', 'Figma', 23, 'Un buen sistema de diseño es un acuerdo, no una librería.', 'Design systems: de Figma a producción'],
  ['Emma Thompson', 'VP Engineering', 'Stripe', 5, 'La confiabilidad es la característica que nadie ve hasta que falla.', 'Panel: IA en la empresa moderna'],
  ['Andrés Gil', 'VP Engineering', 'Rappi', 59, 'Escalar es aprender a decir que no.', 'Mobile-first: React Native a fondo'],
  ['Natasha Kozlova', 'ML Engineer', 'OpenAI', 44, 'Los modelos grandes se ganan en los detalles pequeños.', 'IA generativa: del hype a la producción']
];
const img = n => `https://i.pravatar.cc/800?img=${n}`;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const BR = '<svg aria-hidden="true"><rect x="1" y="1" rx="19" pathLength="1"/></svg>';

/* 1 indice editorial con retrato que sigue al cursor */
$('#idx').innerHTML = SPEAKERS.map((s, i) => `<div class="ix" data-i="${i}"><b>${s[0]}</b><div class="rl"><strong>${s[1]}, ${s[2]}</strong>${s[5]}</div></div>`).join('');
$('#fph').innerHTML = SPEAKERS.map(s => `<img src="${img(s[3])}" alt="">`).join('');
const fl = $('#float'); let fx = innerWidth / 2, fy = innerHeight / 2, tx = fx, ty = fy;
$$('.ix').forEach(r => {
  r.addEventListener('pointerenter', () => { const i = +r.dataset.i; $$('#fph img').forEach((im, j) => im.classList.toggle('on', i === j)); $('#fq').textContent = SPEAKERS[i][4]; fl.classList.add('on'); });
  r.addEventListener('pointerleave', () => fl.classList.remove('on'));
});
addEventListener('pointermove', e => { tx = e.clientX + 190; ty = e.clientY; if (tx + 160 > innerWidth) tx = e.clientX - 190; });
(function follow() { fx += (tx - fx) * .12; fy += (ty - fy) * .12; fl.style.left = fx + 'px'; fl.style.top = fy + 'px'; requestAnimationFrame(follow); })();

/* 2 retrato protagonista con lista */
$('#stg').innerHTML = SPEAKERS.map(s => `<img src="${img(s[3])}" alt="">`).join('') + `<div class="cap"><q id="sq"></q><small id="sm"></small></div><div class="prog" id="prog"></div>`;
$('#list2').innerHTML = SPEAKERS.map((s, i) => `<div class="li" data-i="${i}">${BR}<img src="${img(s[3])}" alt=""><div><b>${s[0]}</b><span>${s[1]}, ${s[2]}</span></div></div>`).join('');
let cur = -1, hold = false, t0 = performance.now();
function show(i) {
  if (i === cur) return; cur = i; t0 = performance.now();
  $$('#stg img').forEach((im, j) => im.classList.toggle('on', i === j));
  $$('#list2 .li').forEach((l, j) => l.classList.toggle('on', i === j));
  $('#sq').textContent = SPEAKERS[i][4]; $('#sm').textContent = `${SPEAKERS[i][0]}, ${SPEAKERS[i][5]}`;
}
$$('#list2 .li').forEach(l => { l.addEventListener('pointerenter', () => { hold = true; show(+l.dataset.i); }); l.addEventListener('pointerleave', () => { hold = false; t0 = performance.now(); }); l.addEventListener('click', () => show(+l.dataset.i)); });
show(0);
(function auto() { const k = (performance.now() - t0) / 5200; if (!hold && $('#o2').classList.contains('on')) { if (k >= 1) show((cur + 1) % SPEAKERS.length); $('#prog').style.width = Math.min(100, k * 100) + '%'; } else $('#prog').style.width = '0'; requestAnimationFrame(auto); })();

/* 3 mosaico editorial */
const SPAN = [[3, 2], [3, 1], [2, 1], [1, 1], [3, 1], [3, 1], [3, 1], [3, 1]];
$('#mos').innerHTML = SPEAKERS.map((s, i) => `<div class="mc ${i === 0 ? 'k' : ''}" style="grid-column:span ${SPAN[i][0]};grid-row:span ${SPAN[i][1]}"><img src="${img(s[3])}" alt=""><svg aria-hidden="true"><rect x="2" y="2" rx="22" pathLength="1"/></svg><div class="tx"><q>${s[4]}</q><b>${s[0]}</b><span>${s[1]}, ${s[2]}</span></div></div>`).join('');

/* controles */
$$('#seg button').forEach(b => b.addEventListener('click', () => { $$('#seg button').forEach(x => x.classList.toggle('on', x === b)); $$('.opt').forEach(o => o.classList.toggle('on', o.id === 'o' + b.dataset.o)); t0 = performance.now(); }));
$$('#sw button').forEach(b => b.addEventListener('click', () => { document.documentElement.style.setProperty('--accent', b.dataset.c); $$('#sw button').forEach(x => x.classList.toggle('on', x === b)); }));
</script>
</body>
</html>
