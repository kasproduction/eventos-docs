# EventOS Nivel 1 — proxy inverso round-robin (PRUEBA). Vive en el droplet semilla,
# reparte por la VPC hacia los nodos por rol. En produccion esto lo hace Cloudflare LB;
# aqui sirve para medir reparto y caida de nodos sin pagar el complemento.
#
# Salud pasiva: max_fails=2 en fail_timeout=10s saca al nodo 10 s y lo reintenta.
# proxy_next_upstream: si un nodo falla, la MISMA peticion se reintenta en el otro.

upstream eventos_api {
    server 10.116.0.14:443 max_fails=2 fail_timeout=10s;   # api-1
    server 10.116.0.15:443 max_fails=2 fail_timeout=10s;   # api-2
    keepalive 64;
}
upstream eventos_web {
    server 10.116.0.16:443 max_fails=2 fail_timeout=10s;   # web-1
    server 10.116.0.17:443 max_fails=2 fail_timeout=10s;   # web-2
    keepalive 32;
}
upstream eventos_sockets {
    server 10.116.0.19:443 max_fails=2 fail_timeout=10s;   # sock-1
    server 10.116.0.18:443 max_fails=2 fail_timeout=10s;   # sock-2
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name api.killjoy.pro;
    ssl_certificate /etc/ssl/eventos/origin.pem;
    ssl_certificate_key /etc/ssl/eventos/origin.key;
    client_max_body_size 50M;
    location / {
        proxy_pass https://eventos_api;
        proxy_ssl_server_name on;
        proxy_ssl_name api.killjoy.pro;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name app.killjoy.pro;
    ssl_certificate /etc/ssl/eventos/origin.pem;
    ssl_certificate_key /etc/ssl/eventos/origin.key;
    client_max_body_size 50M;
    location / {
        proxy_pass https://eventos_web;
        proxy_ssl_server_name on;
        proxy_ssl_name app.killjoy.pro;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name socket.killjoy.pro;
    ssl_certificate /etc/ssl/eventos/origin.pem;
    ssl_certificate_key /etc/ssl/eventos/origin.key;
    location / {
        proxy_pass https://eventos_sockets;
        proxy_ssl_server_name on;
        proxy_ssl_name socket.killjoy.pro;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
